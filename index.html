<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Farol.IA — mentor de carreira</title>
<style>
:root{--bg:#091522;--panel:#10243b;--field:#182f4a;--line:#2b4663;--gold:#f5a623;--light:#ffd280;--muted:#a8b8ca}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,var(--bg),#183955);color:#eef4fa;font:16px Arial;line-height:1.5}.top{position:sticky;top:0;z-index:2;background:#091522ee;border-bottom:1px solid var(--line)}.topin,.wrap{max-width:1050px;margin:auto}.topin{padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{font:bold 22px Georgia;color:var(--light)}.brand small{display:block;color:var(--muted);font:11px Arial}.nav{display:flex;gap:5px;overflow:auto}.nav button,.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:bold;cursor:pointer}.nav button{background:transparent;color:var(--muted);white-space:nowrap}.nav button.active,.btn{background:var(--gold);color:#211700}.btn.alt{background:transparent;border:1px solid var(--line);color:#fff}.wrap{padding:30px 20px 60px}.screen{display:none}.screen.active{display:block}.hero,.panel{background:#10243bee;border:1px solid var(--line);border-radius:18px;padding:clamp(20px,5vw,48px);margin-bottom:18px}.hero h1{font:600 clamp(32px,6vw,58px)/1.1 Georgia;margin:15px 0}.hero p,.hint{color:var(--muted)}.tag{display:inline-block;border:1px solid #a87831;color:var(--light);border-radius:99px;padding:5px 10px;font-size:12px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field{margin-bottom:13px}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:var(--field);color:#fff;font:inherit}.field textarea{min-height:105px;resize:vertical}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:var(--field);padding:18px;border-radius:12px;border:1px solid var(--line)}.stat b{display:block;font:600 30px Georgia;color:var(--light)}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}@media(max-width:650px){.topin{display:block}.nav{margin-top:12px}.wrap{padding:18px 14px}.grid,.stats{grid-template-columns:1fr}.hero,.panel{padding:18px 16px}}
</style>
</head>
<body>
<header class="top"><div class="topin"><div class="brand">farol.ia<small>mentor digital de carreira</small></div><nav class="nav"><button data-tab="home" class="active">Início</button><button data-tab="perfil">Meu perfil</button><button data-tab="dashboard">Dashboard</button></nav></div></header>
<main class="wrap"><section id="screen-home" class="screen active"></section><section id="screen-perfil" class="screen"></section><section id="screen-dashboard" class="screen"></section></main>
<footer style="text-align:center;color:#7890a8;font-size:12px;padding:25px">Farol.IA — dados salvos localmente neste dispositivo.</footer>
<script>
'use strict';
const areas=['Administração e Finanças','Agricultura e Meio Ambiente','Artes e Design','Atendimento e Serviços','Beleza e Estética','Comunicação e Marketing','Construção Civil','Educação','Engenharia','Gastronomia e Turismo','Jurídico','Logística','Manutenção e Indústria','Recursos Humanos','Saúde','Segurança','Tecnologia e Dados','Vendas e Comercial'];
const DEFAULT={dados:{nome:'',email:'',telefone:'',dataNascimento:'',formacao:'',instituicao:'',funcao:'',area:'',experiencias:'',idiomas:''},persona:null,candidaturas:[],cursosFeitos:[]};
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){try{const raw=localStorage.getItem('farolIA_state')||localStorage.getItem('farolIAState_v3');const old=raw?JSON.parse(raw):{};return { ...DEFAULT,...old,dados:{...DEFAULT.dados,...(old.dados||{})}}}catch(e){return JSON.parse(JSON.stringify(DEFAULT))}}
let state=load();
function save(){localStorage.setItem('farolIA_state',JSON.stringify(state))}
function clean(s){return String(s||'').trim().replace(/\s+/g,' ')}
function tab(name){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$('screen-'+name).classList.add('active');document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===name));render();window.scrollTo(0,0)}
document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>tab(x.dataset.tab));
function fields(){return [['nome','Nome completo','text'],['email','E-mail','email'],['telefone','Telefone','tel'],['dataNascimento','Data de nascimento','date'],['formacao','Formação','text'],['instituicao','Instituição','text'],['funcao','Função ou objetivo','text'],['idiomas','Idiomas','text']].map(x=>`<div class="field"><label>${x[1]}</label><input id="d_${x[0]}" type="${x[2]}" value="${esc(state.dados[x[0]])}" ${x[0]==='nome'?'required':''}></div>`).join('')}
function cadastro(){return `<form id="register"><div class="grid">${fields()}</div><div class="field"><label>Área de interesse</label><select id="d_area"><option value="">Escolha uma área</option>${areas.map(a=>`<option value="${esc(a)}" ${state.dados.area===a?'selected':''}>${esc(a)}</option>`).join('')}</select></div><div class="field"><label>Experiências e projetos</label><textarea id="d_exp" placeholder="Uma experiência por linha">${esc(state.dados.experiencias)}</textarea></div><button class="btn" type="submit">Salvar cadastro</button></form>`}
function bindCadastro(){const form=$('register');if(!form)return;form.onsubmit=e=>{e.preventDefault();['nome','email','telefone','dataNascimento','formacao','instituicao','funcao','idiomas'].forEach(k=>state.dados[k]=$('d_'+k).value.trim());state.dados.area=$('d_area').value;state.dados.experiencias=$('d_exp').value.split('\n').map(clean).filter(Boolean).join('\n');save();render();alert('Cadastro salvo com sucesso!')}}
function home(){$('screen-home').innerHTML=`<div class="hero"><span class="tag">🧭 mentor de carreira com IA</span><h1>Seu caminho profissional começa aqui.</h1><p>Preencha seu cadastro, descubra seu potencial e receba orientações para qualquer área profissional.</p><button class="btn" id="start">${state.dados.nome?'Editar meu cadastro':'Começar cadastro'}</button></div><div class="panel"><h2>Cadastro</h2><p class="hint">${state.dados.nome?'Seu cadastro está salvo. Você pode consultar ou editar os dados abaixo a qualquer momento.':'Preencha seus dados para começar.'}</p>${cadastro()}</div>`;$('start').onclick=()=>tab('perfil');bindCadastro()}
function profile(){$('screen-perfil').innerHTML=`<div class="panel"><div class="head"><h2>Meu cadastro</h2><span class="tag">${state.dados.nome?'Dados preenchidos':'Cadastro pendente'}</span></div><p class="hint">Esta é a parte cadastral. Seus dados ficam salvos neste navegador e podem ser alterados quando quiser.</p>${cadastro()}</div>`;bindCadastro()}
function dashboard(){$('screen-dashboard').innerHTML=`<div class="panel"><h2>Dashboard</h2><div class="stats"><div class="stat"><b>${state.dados.nome?'100':'0'}%</b>cadastro</div><div class="stat"><b>${state.candidaturas.length}</b>candidaturas</div><div class="stat"><b>${state.cursosFeitos.length}</b>cursos</div></div>${state.dados.nome?`<p class="hint" style="margin-top:18px">Olá, ${esc(state.dados.nome)}! Seus dados cadastrais estão disponíveis em <b>Meu perfil</b>.</p>`:'<p class="hint" style="margin-top:18px">Complete o cadastro para ver seu progresso.</p>'}</div>`}
function render(){home();profile();dashboard()}render();
</script>
</body>
</html>
