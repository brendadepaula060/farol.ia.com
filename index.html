<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Farol.IA — carreira com direção</title>
<style>
:root{--ink:#10283f;--ink2:#163b59;--gold:#f5a623;--cream:#fff8ea;--muted:#8da5bb;--line:#dce7f0;--bg:#f5f8fb;--ok:#157347;--danger:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:var(--ink);color:white;position:sticky;top:0;z-index:10;box-shadow:0 8px 25px #10283f22}.top{max-width:1180px;margin:auto;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-size:1.5rem;font-weight:900;letter-spacing:-.04em}.brand small{display:block;color:#b7cce0;font-size:.68rem;letter-spacing:.08em;font-weight:600}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav button,.btn{border:0;border-radius:11px;padding:11px 15px;cursor:pointer;font:inherit;font-weight:750;transition:.2s}.nav button{background:#ffffff12;color:white}.nav button.active,.btn.primary{background:var(--gold);color:#172b3b}.btn.secondary{background:#eaf1f6;color:var(--ink)}.btn.dark{background:var(--ink);color:white}.nav button:hover,.btn:hover{transform:translateY(-1px);filter:brightness(1.05)}main{max-width:1180px;margin:auto;padding:30px 20px 65px}.screen{display:none}.screen.active{display:block;animation:up .25s ease}@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}.hero{border-radius:24px;padding:clamp(28px,6vw,72px);background:linear-gradient(120deg,#10283f,#204f70);color:white;box-shadow:0 20px 45px #10283f29;position:relative;overflow:hidden}.hero:after{content:"✦";position:absolute;right:8%;top:5%;font-size:10rem;color:#ffffff10}.tag,.eyebrow{color:var(--gold);font-weight:800;text-transform:uppercase;font-size:.75rem;letter-spacing:.1em}.hero h1{font-size:clamp(2.4rem,6vw,5rem);line-height:.98;max-width:760px;margin:16px 0}.hero p{max-width:680px;color:#d2e1ed;line-height:1.7}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.cards,.stats,.two{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:18px}.card,.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 10px 28px #10283f0d}.card h3{margin:0 0 8px}.muted{color:var(--muted);line-height:1.6}.panel{margin-top:18px}.panel>h2{margin:0 0 6px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.field{display:flex;flex-direction:column;gap:7px;margin:12px 0}.field label{font-weight:750}.field input,.field textarea,.field select{border:1px solid #cbd9e4;border-radius:10px;padding:12px;background:white;color:var(--ink);font:inherit}.field textarea{min-height:115px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{outline:3px solid #f5a62344;border-color:var(--gold)}.req{color:#b42318}.notice{padding:13px 15px;border-radius:11px;margin:14px 0;background:#e8f7ef;color:var(--ok);border:1px solid #a9dfc0}.notice.bad{background:#fff0ef;color:var(--danger);border-color:#f0b6b1}.job{padding:18px;border:1px solid var(--line);border-radius:15px;margin-top:12px}.job h3{margin:0 0 5px}.meta{color:var(--muted);font-size:.9rem}.resume{display:grid;grid-template-columns:230px 1fr;background:white;border:1px solid #dce7f0;border-radius:3px;overflow:hidden;margin-top:20px;box-shadow:0 18px 40px #10283f1b}.resume aside{background:var(--ink);color:white;padding:28px 22px}.resume aside h1{font-size:1.8rem;line-height:1.1;margin:0 0 8px}.resume aside p{color:#c6d8e7;word-break:break-word;font-size:.85rem;line-height:1.55}.resume aside h4{margin:25px 0 8px;color:var(--gold)}.resume main{padding:34px 35px}.resume main h2{font-size:1.35rem;color:var(--ink2);border-bottom:2px solid var(--gold);padding-bottom:8px;margin-top:0}.resume main h3{color:var(--ink2);margin:25px 0 7px}.resume main p{color:#38546b;line-height:1.65}.pill{display:inline-block;background:#fff0c8;color:#76500b;padding:5px 9px;border-radius:30px;margin:3px;font-size:.8rem;font-weight:700}.history-item{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}.status{background:#e8f7ef;color:var(--ok);padding:5px 9px;border-radius:20px;font-size:.78rem;font-weight:800}.course{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid var(--line);padding:13px;border-radius:11px;margin-top:9px}.toast{position:fixed;right:20px;bottom:20px;background:#143e2b;color:white;padding:14px 17px;border-radius:12px;box-shadow:0 15px 30px #0003;display:none;z-index:20}.toast.show{display:block}.loading{opacity:.65;pointer-events:none}@media(max-width:760px){.top{align-items:flex-start;flex-direction:column}.nav{width:100%}.nav button{flex:1}.grid,.two{grid-template-columns:1fr}.cards,.stats{grid-template-columns:1fr}.resume{grid-template-columns:1fr}.resume aside{padding:24px}.resume main{padding:25px 20px}.history-item{grid-template-columns:1fr}.hero h1{font-size:clamp(2.4rem,13vw,4rem)}}
</style>
</head>
<body>
<header><div class="top"><div class="brand">farol.ia<small>carreira com direção</small></div><nav class="nav"><button data-tab="home">Início</button><button data-tab="perfil">Meu perfil</button><button data-tab="vagas">Vagas</button><button data-tab="curriculo">Currículo</button><button data-tab="historico">Histórico</button></nav></div></header>
<main><section id="home" class="screen"></section><section id="perfil" class="screen"></section><section id="vagas" class="screen"></section><section id="curriculo" class="screen"></section><section id="historico" class="screen"></section></main><div id="toast" class="toast"></div>
<script>
'use strict';
const API='/api';
const areas=['Administração e Finanças','Agricultura e Meio Ambiente','Artes e Design','Atendimento e Serviços','Beleza e Estética','Comunicação e Marketing','Construção Civil','Educação e Formação','Gastronomia e Hotelaria','Informática e Tecnologia','Saúde e Bem-Estar','Vendas e Comercial'];
const jobs=[['Assistente Administrativo','Administração e Finanças',['Excel Básico','Administração']],['Assistente de Marketing','Comunicação e Marketing',['Marketing Digital','Redes Sociais']],['Suporte Técnico','Informática e Tecnologia',['Excel Básico','Fundamentos de TI']],['Atendente de Serviços','Atendimento e Serviços',['Atendimento ao Cliente','Liderança de Equipe']],['Consultor de Vendas','Vendas e Comercial',['Vendas Consultivas','Negociação']],['Técnico de Enfermagem','Saúde e Bem-Estar',['Primeiros Socorros','Atendimento em Saúde']]].map(([name,area,req])=>({name,area,req}));
const courses={'Administração e Finanças':['Excel Básico','Administração'],'Comunicação e Marketing':['Marketing Digital','Redes Sociais'],'Informática e Tecnologia':['Excel Básico','Fundamentos de TI'],'Atendimento e Serviços':['Atendimento ao Cliente','Liderança de Equipe'],'Vendas e Comercial':['Vendas Consultivas','Negociação'],'Saúde e Bem-Estar':['Primeiros Socorros','Atendimento em Saúde']};
const courseLinks={'Excel Básico':'https://www.ev.org.br/cursos','Administração':'https://www.sebrae.com.br/sites/PortalSebrae/curso','Marketing Digital':'https://www.sebrae.com.br/sites/PortalSebrae/curso','Redes Sociais':'https://www.ev.org.br/cursos','Fundamentos de TI':'https://www.ev.org.br/cursos','Atendimento ao Cliente':'https://www.ev.org.br/cursos','Liderança de Equipe':'https://www.sebrae.com.br/sites/PortalSebrae/curso','Vendas Consultivas':'https://www.sebrae.com.br/sites/PortalSebrae/curso','Negociação':'https://www.ev.org.br/cursos','Primeiros Socorros':'https://www.ev.org.br/cursos','Atendimento em Saúde':'https://www.sebrae.com.br/sites/PortalSebrae/curso'};
const blank={nome:'',email:'',telefone:'',dataNascimento:'',formacao:'',instituicao:'',funcao:'',area:'',experiencias:'',idiomas:'',cursos:'',cursosSalvos:[],candidaturas:[]};let state={...blank};let selectedJob=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(text,bad=false){const n=$('toast');n.textContent=text;n.style.background=bad?'#8e2c25':'#143e2b';n.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>n.classList.remove('show'),4000)}
async function request(path,options={}){const response=await fetch(API+path,{headers:{'Content-Type':'application/json'},...options});if(!response.ok)throw new Error(await response.text()||'Falha de comunicação com o servidor');return response.status===204?null:response.json()}
async function loadData(){const email=state.email.trim();if(!email)return;try{const data=await request('/profile?email='+encodeURIComponent(email));if(data?.profile)state={...blank,...data.profile,candidaturas:Array.isArray(data.applications)?data.applications:[]};renderProfile();toast('Dados carregados do servidor.')}catch(e){toast('Não foi possível carregar seus dados do servidor.',true)}}
async function saveProfile(){const payload={...state};try{const data=await request('/profile',{method:'PUT',body:JSON.stringify(payload)});state={...state,...data.profile,candidaturas:data.applications||state.candidaturas};toast('Perfil salvo no servidor com sucesso!');renderProfile()}catch(e){toast('Falha ao salvar no servidor. Verifique a configuração do backend.',true)}}
function tab(name){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(name).classList.add('active');document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===name));({home:renderHome,perfil:renderProfile,vagas:renderJobs,curriculo:renderResume,historico:renderHistory}[name])()}document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>tab(x.dataset.tab));
function renderHome(){$('home').innerHTML='<div class="hero"><span class="tag">🧭 mentor digital de carreira</span><h1>Um currículo forte abre portas.</h1><p>Crie uma apresentação profissional, adapte seu currículo às vagas e acompanhe cada candidatura em um só lugar — com seus dados salvos no servidor.</p><div class="actions"><button class="btn primary" onclick="tab(\'perfil\')">Montar meu perfil</button><button class="btn secondary" onclick="tab(\'vagas\')">Explorar vagas</button></div></div><div class="cards"><div class="card"><h3>CV profissional</h3><p class="muted">Layout completo, legível e pronto para salvar em PDF.</p></div><div class="card"><h3>Candidatura inteligente</h3><p class="muted">Veja seu nível de aderência e os cursos gratuitos recomendados.</p></div><div class="card"><h3>Histórico organizado</h3><p class="muted">Acompanhe vagas salvas, datas e status de cada candidatura.</p></div></div>'}
function renderProfile(){const defs=[['nome','Nome completo','text'],['email','E-mail','email'],['telefone','Telefone','tel'],['dataNascimento','Data de nascimento','date'],['formacao','Formação','text'],['instituicao','Instituição','text'],['funcao','Função desejada','text'],['area','Área de interesse','select'],['experiencias','Experiências e competências','textarea'],['idiomas','Idiomas','text'],['cursos','Cursos realizados (separe por vírgulas)','text']];const fields=defs.map(([key,label,type])=>{const required=['nome','email','funcao','area'].includes(key);const star=required?' <span class="req">*</span>':'';const value=state[key]||'';if(type==='select')return `<div class="field"><label>${label}${star}</label><select id="f_${key}"${required?' required':''}><option value="">Selecione</option>${areas.map(a=>`<option value="${esc(a)}" ${a===value?'selected':''}>${esc(a)}</option>`).join('')}</select></div>`;if(type==='textarea')return `<div class="field" style="grid-column:1/-1"><label>${label}${star}</label><textarea id="f_${key}"${required?' required':''}>${esc(value)}</textarea></div>`;return `<div class="field"><label>${label}${star}</label><input id="f_${key}" type="${type}" value="${esc(value)}"${required?' required':''}></div>`}).join('');const list=courses[state.area]||[];$('perfil').innerHTML=`<div class="panel"><span class="eyebrow">Meu espaço</span><h2>Seu perfil profissional</h2><p class="muted">Os campos com <span class="req">*</span> são obrigatórios. O salvamento usa o backend configurado em <code>/api</code>.</p><form id="profileForm"><div class="grid">${fields}</div><h3>Meus cursos gratuitos</h3><div class="two" id="courseChecks">${list.map(name=>`<label><input type="checkbox" value="${esc(name)}" ${(state.cursosSalvos||[]).includes(name)?'checked':''}> ${esc(name)}</label>`).join('')||'<span class="muted">Escolha uma área para ver cursos.</span>'}</div><div class="actions"><button class="btn primary">Salvar no servidor</button><button type="button" class="btn secondary" onclick="tab(\'curriculo\')">Ver currículo</button></div></form></div>`;$('f_area').onchange=()=>renderProfile();$('profileForm').onsubmit=async e=>{e.preventDefault();if(!e.target.reportValidity())return;defs.forEach(([key])=>state[key]=$('f_'+key).value.trim());state.cursosSalvos=[...$('courseChecks').querySelectorAll('input:checked')].map(x=>x.value);await saveProfile()};if(state.email)loadData()}
function match(job){const text=(`${state.experiencias} ${state.cursos} ${state.funcao} ${(state.cursosSalvos||[]).join(' ')}`).toLowerCase();return job.req.filter(x=>!text.includes(x.toLowerCase()))}
async function apply(job){if(!state.nome||!state.email||!state.funcao||!state.area){toast('Complete o perfil antes de se candidatar.',true);tab('perfil');return}const missing=match(job);try{const data=await request('/applications',{method:'POST',body:JSON.stringify({email:state.email,job,missing})});state.candidaturas=data.applications||state.candidaturas;selectedJob=job;toast('Candidatura registrada no servidor!');tab('curriculo')}catch(e){toast('Não foi possível registrar a candidatura.',true)}}
function renderJobs(){if(!state.email||!state.area){$('vagas').innerHTML='<div class="panel"><h2>Vagas recomendadas</h2><p class="muted">Complete e salve seu perfil para receber oportunidades.</p><button class="btn primary" onclick="tab(\'perfil\')">Ir para o perfil</button></div>';return}const list=jobs.filter(j=>j.area===state.area);$('vagas').innerHTML=`<div class="panel"><span class="eyebrow">Próximo passo</span><h2>Vagas para você</h2><p class="muted">Adapte o currículo ou salve a oportunidade para acompanhar depois.</p>${list.map(j=>{const missing=match(j);return `<article class="job"><h3>${esc(j.name)}</h3><span class="meta">${esc(j.area)} · Requisitos: ${j.req.map(esc).join(', ')}</span><p class="muted">${missing.length?'Cursos a desenvolver: '+missing.join(', '):'Seu perfil contempla os principais requisitos.'}</p><div class="actions"><button class="btn primary" onclick='apply(${JSON.stringify(j).replace(/"/g,'&quot;')})'>Candidatar com CV adaptado</button><button class="btn secondary" onclick='saveOnly(${JSON.stringify(j).replace(/"/g,'&quot;')})'>Salvar vaga</button></div></article>`}).join('')}</div>`}
async function saveOnly(job){try{const data=await request('/applications',{method:'POST',body:JSON.stringify({email:state.email,job,missing:match(job),status:'Salva'})});state.candidaturas=data.applications||state.candidaturas;toast('Vaga salva no histórico.');renderJobs()}catch(e){toast('Falha ao salvar vaga.',true)}}
function renderResume(){const job=selectedJob;const missing=job?match(job):[];const title=job?`CV adaptado para ${esc(job.name)}`:'Seu CV profissional';const coursesHtml=missing.length?`<div class="notice bad"><b>Recomendação para esta vaga</b><div>${missing.map(name=>`<div class="course"><span><b>${esc(name)}</b><br><small>Curso gratuito recomendado</small></span><a class="btn secondary" href="${courseLinks[name]||'https://www.ev.org.br/cursos'}" target="_blank">Ver curso</a></div>`).join('')}</div></div>`:'';$('curriculo').innerHTML=`<div class="panel"><span class="eyebrow">Apresentação profissional</span><h2>${title}</h2><p class="muted">Use o botão de impressão para escolher “Salvar como PDF”.</p>${coursesHtml}<div class="resume" id="resumeBox"><aside><h1>${esc(state.nome||'Seu nome')}</h1><p>${esc(state.funcao||'Profissional')}</p><h4>Contato</h4><p>${esc(state.email||'seuemail@email.com')}<br>${esc(state.telefone||'')}</p><h4>Perfil</h4><p>${esc(state.area||'Área profissional')}</p><h4>Idiomas</h4><p>${esc(state.idiomas||'Não informado')}</p></aside><main><h2>Resumo profissional</h2><p>Profissional com foco em <b>${esc(state.funcao||'carreira')}</b>, interessado(a) em oportunidades de ${esc(state.area||'desenvolvimento')}. ${esc(state.experiencias||'Perfil motivado, organizado e pronto para aprender.')}</p><h3>Formação</h3><p>${esc(state.formacao||'Não informada')}${state.instituicao?' · '+esc(state.instituicao):''}</p><h3>Experiências e competências</h3><p>${esc(state.experiencias||'Não informadas')}</p><h3>Cursos</h3><p>${(state.cursosSalvos||[]).concat((state.cursos||'').split(',').map(x=>x.trim()).filter(Boolean)).map(x=>`<span class="pill">${esc(x)}</span>`).join('')||'Não informados'}</p></main></div><div class="actions"><button class="btn primary" onclick="printResume()">Baixar / imprimir PDF</button><button class="btn secondary" onclick="tab(\'perfil\')">Editar dados</button></div></div>`}
function printResume(){const box=$('resumeBox');if(!box){toast('Preencha seu perfil primeiro.',true);return}const win=window.open('','_blank');win.document.write(`<html><head><title>CV - ${esc(state.nome)}</title><style>body{font:14px Arial;color:#10283f;margin:0}.resume{display:grid;grid-template-columns:230px 1fr}.resume aside{background:#10283f;color:white;padding:28px}.resume main{padding:34px}.resume h2,.resume h3{color:#163b59;border-bottom:2px solid #f5a623;padding-bottom:7px}.resume aside h1,.resume aside h4{color:#ffd98a}.resume p{line-height:1.6}.pill{display:inline-block;background:#fff0c8;padding:5px 9px;border-radius:20px;margin:3px}</style></head><body>${box.outerHTML}<script>onload=()=>print()<\/script></body></html>`);win.document.close()}
async function renderHistory(){if(!state.email){$('historico').innerHTML='<div class="panel"><h2>Histórico de candidaturas</h2><p class="muted">Salve seu perfil para consultar seu histórico.</p></div>';return}try{const data=await request('/applications?email='+encodeURIComponent(state.email));state.candidaturas=data.applications||[];$('historico').innerHTML=`<div class="panel"><span class="eyebrow">Acompanhe seus passos</span><h2>Histórico de candidaturas</h2><p class="muted">Tudo salvo no servidor para você consultar de qualquer dispositivo.</p>${state.candidaturas.length?state.candidaturas.slice().reverse().map((a,i)=>`<div class="history-item"><div><b>${esc(a.job?.name||a.name||'Vaga')}</b><div class="meta">${esc(a.job?.area||a.area||'')} · ${new Date(a.created_at||a.date||Date.now()).toLocaleDateString('pt-BR')}</div></div><span class="status">${esc(a.status||'Salva')}</span></div>`).join(''):'<p class="muted">Nenhuma candidatura registrada ainda.</p>'}</div>`}catch(e){$('historico').innerHTML='<div class="panel"><h2>Histórico indisponível</h2><p class="muted">Configure o backend para consultar suas candidaturas.</p></div>'}}
renderHome();
</script></body></html>
