<html lang="pt-BR">
<head>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    :root {
      color-scheme: dark;
      --ink: #0a1420;
      --panel: #0f2035;
      --field: #16283e;
      --line: rgba(255,255,255,.1);
      --gold: #f5a623;
      --light: #ffd280;
      --muted: #93a5bc;
      --green: #5aab84;
      --serif: Fraunces, Georgia, serif;
      --sans: Inter, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin:0; min-height:100%; background: radial-gradient(120% 100% at 15% -10%, #11253c, #08131c 55%); color:#eef2f7; font-family:var(--sans); line-height:1.5; }
    body { min-height:100vh; }
    button,input,textarea,select { font:inherit; }
    .top { position: sticky; top:0; z-index:5; background: rgba(10,20,32,.95); border-bottom:1px solid var(--line); backdrop-filter:blur(10px); }
    .top-inner { max-width:1040px; margin:auto; padding:14px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .brand { font:italic 600 22px var(--serif); color:var(--light); white-space:nowrap; }
    .brand small { font: 12px var(--sans); color:#5f7590; letter-spacing:.04em; margin-left:8px; }
    .nav { display:flex; flex-wrap:wrap; gap:8px; overflow-x:auto; scrollbar-width:none; }
    .nav::-webkit-scrollbar { display:none; }
    .nav button { border:0; background:transparent; color:var(--muted); padding:9px 12px; border-radius:999px; white-space:nowrap; font-size:13px; }
    .nav button.active { background:var(--gold); color:var(--ink); font-weight:700; }
    .wrap { max-width:1040px; margin:auto; padding:0 20px 30px; }
    .screen { display:none; padding:38px 0 0; }
    .screen.active { display:block; }
    .hero { position:relative; overflow:hidden; padding:clamp(34px, 8vw, 64px) clamp(20px, 3vw, 40px); border:1px solid var(--line); border-radius:20px; background:linear-gradient(180deg, #0d1e2f, #0a1624); margin-bottom:24px; }
    .hero:after { content:""; position:absolute; width:500px; height:500px; left:-220px; top:-260px; background:radial-gradient(circle, rgba(245,166,35,.22), transparent 65%); pointer-events:none; }
    .hero h1 { font:600 clamp(38px,7vw,72px)/1.12 var(--serif); max-width:650px; color:#fff; margin:0; }
    .hero p { max-width:540px; color:var(--muted); font-size:17px; margin-top:18px; }
    .tag, .hint, .label { font-size:12px; color:var(--muted); }
    .tag { display:inline-block; padding:5px 10px; border:1px solid var(--line); border-radius:999px; background:var(--field); margin-bottom:18px; }
    .tag.gold { color:var(--light); background:rgba(245,166,35,.1); border-color:rgba(245,166,35,.35); }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:clamp(20px, 3vw, 28px); margin-bottom:18px; }

    .head h2, .head h3 { margin:0; font:600 clamp(26px, 3vw, 36px) var(--serif); }
    .btn, button:not(.nav button) { border:0; border-radius:12px; background:var(--gold); color:var(--ink); padding:12px 18px; font-weight:700; cursor:pointer; }
    .btn.secondary { background:transparent; border:1px solid var(--line); color:#fff; }
    .btn.full { width:100%; }
    .grid { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:14px; }
    .field { margin-bottom:16px; }
    .field label { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; }
    .field input, .field select, .field textarea { width:100%; border:1px solid var(--line); background:var(--field); color:#fff; padding:12px 13px; border-radius:9px; font-size:16px; min-height:46px; }
    .field textarea { min-height:110px; resize:vertical; }
    .dots { display:flex; gap:6px; margin-bottom:24px; }
    .dot { height:5px; flex:0 0 28px; border-radius:4px; background:var(--field); }
    .dot.done { background:var(--gold); }
    .dot.now { background:var(--light); }
    .quiz-box { display:grid; gap:14px; }
    .quiz-option { width:100%; text-align:left; border:1px solid var(--line); background:var(--field); color:#fff; padding:14px 16px; border-radius:10px; }
    .stats { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px; }
    .stat { background:var(--field); border:1px solid var(--line); border-radius:12px; padding:18px; }
    .stat b { display:block; font:600 32px var(--serif); color:var(--light); }
    .cards { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:14px; }
    .card { background:var(--field); border:1px solid var(--line); border-radius:14px; padding:18px; }
    .card h4 { margin:0 0 8px; font-size:20px; }
    .job { background:var(--field); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:14px; }
    .job-header { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
    .job-title { margin:0 0 6px; font-size:22px; }
    .job-meta { color:var(--muted); font-size:13px; }
    .pill { display:inline-block; background:rgba(90,171,132,.12); color:#b9ebd2; border:1px solid rgba(90,171,132,.4); border-radius:999px; padding:6px 10px; font-size:12px; }
    .job-actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
    .course-list { display:grid; gap:10px; }
    .course-item { background:var(--field); border:1px solid var(--line); border-radius:12px; padding:14px 16px; display:flex; gap:12px; justify-content:space-between; align-items:center; }
    .course-item a { color:var(--light); text-decoration:none; }
    .course-item small { color:var(--muted); }
    .badge { display:inline-block; background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:4px 8px; font-size:12px; color:var(--muted); }
    .feedback-grid { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px; }
    .feedback-box { border:1px solid var(--line); background:var(--field); border-radius:12px; padding:16px; }
    .feedback-box h4 { margin:0 0 8px; font-size:16px; color:var(--light); }
    ul { margin:0; padding-left:18px; }
    .mentor-shell { display:grid; gap:14px; }
    .messages { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px; min-height:260px; max-height:420px; overflow:auto; }
    .msg { margin-bottom:12px; max-width:85%; padding:12px 14px; border-radius:12px; }

      .top-inner { padding:12px 14px; }
      .wrap { padding:0 14px 26px; }
      .nav { gap:6px; }
      .job-header { flex-direction:column; }
      .chat-form { flex-direction:column; }
    }
  </style>

        { name:'Prevenção e Risco', hours:8, institution:'Coursera', url:'https://www.coursera.org/search?query=seguranca%20trabalho' },
        { name:'Comunicação de Segurança', hours:6, institution:'Fundação Bradesco', url:'https://www.ev.org.br/cursos' }
      ] },
      { id: 'beleza', label: 'Beleza e Estética', jobs: [{ name: 'Atendente de Salão', area:'Beleza e Estética', skills:['Empatia','Comunicação'] }, { name: 'Auxiliar de Estética', area:'Beleza e Estética', skills:['Empatia','Organização'] }, { name: 'Consultora de Beleza', area:'Beleza e Estética', skills:['Relacionamento','Comunicação'] }], skills:['Empatia','Relacionamento','Comunicação'], courses:[
        { name:'Atendimento e Vendas na Beleza', hours:7, institution:'SEBRAE', url:'https://www.sebrae.com.br/sites/PortalSebrae' },
        { name:'Marketing Estético', hours:6, institution:'Coursera', url:'https://www.coursera.org/search?query=beleza%20marketing' },
        { name:'Comunicacão de Marca', hours:6, institution:'Fundação Bradesco', url:'https://www.ev.org.br/cursos' }
      ] }
    ];

    const JOBS = AREA_CATALOG.flatMap(area => area.jobs.map(job => ({ ...job, areaId: area.id, areaLabel: area.label })));

    const state = load();
    let quizIndex = 0;
    let openJob = -1;

    function clone(v) { return JSON.parse(JSON.stringify(v)); }
    function merge(base, extra) {
      Object.keys(extra || {}).forEach(k => {
        if (extra[k] !== undefined) base[k] = extra[k];
      });
      return base;
    }

    function load() {
      try {
        const raw = localStorage.getItem('farolIA_state');
        if (!raw) return clone(DEFAULT);
        const parsed = JSON.parse(raw);
        return merge(clone(DEFAULT), parsed);
      } catch (e) {
        return clone(DEFAULT);
      }
    }

    function save() {
      localStorage.setItem('farolIA_state', JSON.stringify(state));
    }

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function val(id) {
      const el = document.getElementById(id);
      return el ? el.value : '';
    }

    function tab(name) {
      document.querySelectorAll('.screen').forEach(x => x.classList.remove('active'));
      const target = document.getElementById('screen-' + name);
      if (target) target.classList.add('active');
      document.querySelectorAll('.nav button').forEach(btn => btn.classList.toggle('active', btn.dataset.tab === name));
    }

    function getCurrentPersona() {
      return state.persona ? PERSONAS[state.persona] : null;
    }

    function resetQuiz() {
      quizIndex = 0;
      state.quiz = [];
      state.persona = null;
      state.potencialTexto = '';
      state.competencias = [];
      save();
      renderPerfil();
    }

    function evaluatePersona() {
      const scores = { c: 0, a: 0, s: 0, p: 0 };
      state.quiz.forEach(answer => {
        if (answer === 'Procurar informações e entender o contexto') scores.a += 1;
        if (answer === 'Pensar em ideias diferentes') scores.c += 1;
        if (answer === 'Conversar com quem já passou por isso') scores.s += 1;
        if (answer === 'Criar um plano prático e testar') scores.p += 1;

        if (answer === 'Leitura e análise de dados') scores.a += 1;
        if (answer === 'Aula prática com exemplos') scores.p += 1;
        if (answer === 'Conversas e feedback') scores.s += 1;
        if (answer === 'Criação e experimentação') scores.c += 1;

        if (answer === 'Organizado e detalhado') scores.a += 1;
        if (answer === 'Estruturado com métricas') scores.a += 1;
        if (answer === 'Colaborativo e apoiador') scores.s += 1;
        if (answer === 'Dinâmico e criativo') scores.c += 1;

        if (answer === 'Resolver problemas reais') scores.p += 1;
        if (answer === 'Ajudar pessoas e processos') scores.s += 1;
        if (answer === 'Criar impacto e inovações') scores.c += 1;
        if (answer === 'Aprender coisas novas e evoluir') scores.p += 1;
      });

      const winner = Object.keys(scores).sort((x, y) => scores[y] - scores[x])[0];
      state.persona = winner;
      state.competencias = PERSONAS[winner][2];
      state.potencialTexto = PERSONAS[winner][1];
      save();
      renderPerfil();
      renderHome();
      renderDashboard();
    }

    function renderHome() {
      const home = document.getElementById('screen-home');
      const p = getCurrentPersona();
      const stats = {
        candidaturas: state.candidaturas.length,
        cursos: state.cursosFeitos.length,
        perfil: state.persona ? 100 : Math.min(80, (state.quiz.length * 25))
      };

      home.innerHTML = `
        <div class="hero">
          <span class="tag gold">🧭 mentor de carreira com IA</span>
          <h1>Porque encontrar uma vaga é importante.<br>Encontrar seu caminho também.</h1>
          <p>O Farol.IA ajuda você a entender seu potencial, ver oportunidades compatíveis, receber feedback de desenvolvimento e planejar cursos para crescer em direção à carreira certa.</p>
        </div>
        <div class="cards">
          <div class="panel">
            <div class="head"><h3>Resumo do seu caminho</h3></div>
            <div class="stats">
              <div class="stat"><b>${stats.candidaturas}</b>candidaturas</div>
              <div class="stat"><b>${stats.cursos}</b>cursos</div>
              <div class="stat"><b>${stats.perfil}%</b>perfil</div>
            </div>
          </div>
          <div class="panel">
            <div class="head"><h3>Seu perfil atual</h3></div>
            ${p ? `
              <div class="card" style="background:rgba(245,166,35,.08); border-color:rgba(245,166,35,.35);">
                <h4>${p[0]}</h4>
                <p class="muted">${p[1]}</p>
                <div class="spacer"></div>
                <div class="badge">${p[2].join(' • ')}</div>
              </div>
            ` : '<p class="muted">Complete o perfil para desbloquear seu mapa de carreira.</p>'}
          </div>
        </div>
      `;
    }

    function renderPerfil() {
      const box = document.getElementById('screen-perfil');
      const p = getCurrentPersona();

      if (!state.persona) {
        box.innerHTML = `
          <div class="panel">
            <div class="head">
              <h2>Meu perfil</h2>
              <span class="hint">Vamos descobrir seu potencial em 4 passos</span>
            </div>
            <div class="dots">${QUESTIONS.map((_, i) => `<i class="dot ${i === quizIndex ? 'now' : ''}"></i>`).join('')}</div>
            <div class="quiz-box">
              <h3>${QUESTIONS[quizIndex][0]}</h3>
              ${QUESTIONS[quizIndex][1].map(option => `<button class="quiz-option" type="button" data-answer="${esc(option)}">${option}</button>`).join('')}
            </div>
          </div>
        `;

        box.querySelectorAll('.quiz-option').forEach(btn => {
          btn.addEventListener('click', () => {
            state.quiz.push(btn.dataset.answer);
            save();
            if (quizIndex < QUESTIONS.length - 1) {
              quizIndex += 1;
              renderPerfil();
            } else {
              evaluatePersona();
            }
          });
        });
        return;
      }

      const dados = state.dados;
      box.innerHTML = `
        <div class="panel">
          <div class="head">
            <h2>Meu perfil</h2>
            <button type="button" class="btn secondary" id="reset-quiz">Refazer diagnóstico</button>
          </div>
          <div class="grid">
            <div class="field">
              <label>Nome</label>
              <input id="nome" value="${esc(dados.nome)}" placeholder="Seu nome completo">
            </div>
            <div class="field">
              <label>E-mail</label>
              <input id="email" value="${esc(dados.email)}" type="email" placeholder="seu@email.com">
            </div>
            <div class="field">
              <label>Telefone</label>
              <input id="telefone" value="${esc(dados.telefone)}" placeholder="(00) 00000-0000">
            </div>
            <div class="field">
              <label>Data de nascimento</label>
              <input id="dataNascimento" value="${esc(dados.dataNascimento)}" type="date">
            </div>
            <div class="field">
              <label>Formação</label>
              <input id="formacao" value="${esc(dados.formacao)}" placeholder="Ex.: Ensino Médio, Graduação...">
            </div>
            <div class="field">
              <label>Instituição</label>
              <input id="instituicao" value="${esc(dados.instituicao)}" placeholder="Ex.: ETEC, UFMG, etc.">
            </div>
            <div class="field">
              <label>Função / objetivo</label>
              <input id="funcao" value="${esc(dados.funcao)}" placeholder="Ex.: Assistente administrativo, UX Junior...">
            </div>
            <div class="field">
              <label>Área de interesse</label>
              <select id="area">
                <option value="">Selecione</option>
                ${AREA_CATALOG.map(area => `<option value="${area.label}" ${dados.area === area.label ? 'selected' : ''}>${area.label}</option>`).join('')}
              </select>
            </div>
            <div class="field" style="grid-column:1 / -1;">
              <label>Experiências relevantes</label>
              <textarea id="experiencias" placeholder="Descreva atividades, projetos, estágios, voluntariado ou experiências de trabalho.">${esc(dados.experiencias)}</textarea>
            </div>
            <div class="field" style="grid-column:1 / -1;">
              <label>Idiomas / habilidades complementares</label>
              <input id="idiomas" value="${esc(dados.idiomas)}" placeholder="Ex.: Inglês básico, Canva, Excel, atendimento ao cliente">
            </div>
          </div>
          <div class="spacer"></div>
          <button type="button" class="btn full" id="save-profile">Salvar perfil</button>
        </div>

        <div class="panel">
          <div class="head"><h3>Seu potencial</h3></div>
          <div class="card" style="background:rgba(90,171,132,.08); border-color:rgba(90,171,132,.35);">
            <h4>${p[0]}</h4>
            <p class="muted">${p[1]}</p>
            <div class="spacer"></div>
            <div class="badge">${p[2].join(' • ')}</div>
          </div>
        </div>
      `;

      document.getElementById('save-profile').addEventListener('click', () => {
        state.dados = {
          nome: val('nome'),
          email: val('email'),
          telefone: val('telefone'),
          dataNascimento: val('dataNascimento'),
          formacao: val('formacao'),
          instituicao: val('instituicao'),
          funcao: val('funcao'),
          area: val('area'),
          experiencias: val('experiencias'),
          idiomas: val('idiomas'),
          cursosComp: state.dados.cursosComp || []
        };
        save();
        renderHome();
        renderJobs();
        renderDashboard();
      });

      document.getElementById('reset-quiz').addEventListener('click', resetQuiz);
    }

    function getTopJobsForPersona() {
      const p = getCurrentPersona();
      if (!p) return JOBS.slice(0, 6);
      const matches = JOBS.map(job => {
        const score = job.skills.filter(skill => p[2].includes(skill)).length + (job.areaLabel === state.dados.area ? 2 : 0);
        return { ...job, score };
      }).sort((a, b) => b.score - a.score);
      return matches.slice(0, 8);
    }

    function renderJobs() {
      const box = document.getElementById('screen-vagas');
      const p = getCurrentPersona();
      if (!p) {
        box.innerHTML = '<div class="panel"><p class="muted">Complete seu perfil em “Meu perfil” para ver oportunidades compatíveis.</p></div>';
        return;
      }

      const jobs = getTopJobsForPersona();
      box.innerHTML = `
        <div class="head">
          <h2>Oportunidades compatíveis</h2>
          <span class="hint">Ordenadas pela sua aderência</span>
        </div>
        <div class="panel">
          ${jobs.map((job, index) => `
            <div class="job ${openJob === index ? 'open' : ''}">
              <div class="job-header">
                <div>
                  <h3 class="job-title">${job.name}</h3>
                  <div class="job-meta">${job.areaLabel} • aderência ${Math.min(98, 60 + job.score * 12)}%</div>
                </div>
                <span class="pill">${job.skills.join(' • ')}</span>
              </div>
              <div class="job-actions">
                <button type="button" class="btn" data-apply="${index}">Candidatura inteligente</button>
                <button type="button" class="btn secondary" data-open="${index}">Ver plano</button>
              </div>
              ${openJob === index ? `
                <div class="panel" style="margin:16px 0 0; background:rgba(17,26,38,.5);">
                  <h4>Plano de ação</h4>
                  <ul>
                    <li>Fortaleça ${job.skills.slice(0, 2).join(' e ')}.</li>
                    <li>Estude com os cursos mais relevantes para ${job.areaLabel}.</li>
                    <li>Prepare uma apresentação com resultados e objetivos claros.</li>
                  </ul>
                </div>
              ` : ''}
            </div>
          `).join('')}
        </div>
      `;

      box.querySelectorAll('[data-apply]').forEach(btn => btn.addEventListener('click', () => {
        const index = Number(btn.dataset.apply);
        const selectedJob = jobs[index];
        createSmartApplication(selectedJob);
      }));

      box.querySelectorAll('[data-open]').forEach(btn => btn.addEventListener('click', () => {
        const index = Number(btn.dataset.open);
        openJob = openJob === index ? -1 : index;
        renderJobs();
      }));
    }

    function renderProgress() {
      const box = document.getElementById('screen-dashboard');
      const done = state.candidaturas.length;
      const cursos = state.cursosFeitos.length;
      const perfil = state.persona ? 100 : 0;

      box.innerHTML = `
        <div class="head">
          <h2>Dashboard</h2>
          <span class="hint">Seu mentor IA em ação</span>
        </div>
        <div class="stats">
          <div class="stat"><b>${done}</b>candidaturas</div>
          <div class="stat"><b>${cursos}</b>cursos</div>
          <div class="stat"><b>${perfil}%</b>perfil</div>
        </div>
        <div class="feedback-grid" style="margin-top:18px;">
          <div class="feedback-box">
            <h4>✅ O que você já faz bem</h4>
            <ul>
              ${(getCurrentPersona()?.[2] || ['Organização','Comunicação']).map(item => `<li>${item}</li>`).join('')}
            </ul>
          </div>
          <div class="feedback-box">
            <h4>🔎 O que pode melhorar</h4>
            <ul>
              <li>Fortalecer a comunicação com prioridade</li>
              <li>Organizar melhor a rotina de estudos</li>
              <li>Mostrar resultados em frases objetivas</li>
            </ul>
          </div>
          <div class="feedback-box">
            <h4>🎯 Proximo passo</h4>
            <ul>
              <li>Escolher uma área de interesse</li>
              <li>Completar o currículo</li>
              <li>Marcar 2 cursos por semana</li>
            </ul>
          </div>
        </div>
      `;
    }

    function getRecommendedCoursesForArea(areaLabel) {
      const area = AREA_CATALOG.find(item => item.label === areaLabel) || AREA_CATALOG[0];
      return area.courses;
    }

    function buildDashboardFeedback() {
      const p = getCurrentPersona();
      const areaLabel = state.dados.area || 'Marketing e Conteúdo';
      const courses = getRecommendedCoursesForArea(areaLabel);
      const strengths = p ? p[2] : ['Comunicação', 'Autonomia'];
      const focus = ['Comunicação clara', 'Objetividade no currículo', 'Atenção à meta de carreira'];
      const next = courses.slice(0, 3);

      return {
        strengths,
        focus,
        next
      };
    }

    function renderDashboard() {
      const feedback = buildDashboardFeedback();
      const box = document.getElementById('screen-dashboard');

      box.innerHTML = `
        <div class="head">
          <h2>Dashboard</h2>
          <span class="hint">Feedback do mentor para seu desenvolvimento</span>
        </div>
        <div class="stats">
          <div class="stat"><b>${state.candidaturas.length}</b>candidaturas</div>
          <div class="stat"><b>${state.cursosFeitos.length}</b>cursos</div>
          <div class="stat"><b>${state.persona ? 100 : 0}%</b>perfil</div>
        </div>
        <div class="spacer"></div>
        <div class="feedback-grid">
          <div class="feedback-box">
            <h4>✅ Pontos fortes</h4>
            <ul>${feedback.strengths.map(item => `<li>${item}</li>`).join('')}</ul>
          </div>
          <div class="feedback-box">
            <h4>📌 O que pode melhorar</h4>
            <ul>${feedback.focus.map(item => `<li>${item}</li>`).join('')}</ul>
          </div>
          <div class="feedback-box">
            <h4>🚀 Próximos passos</h4>
            <ul>${feedback.next.map(item => `<li>${item.name}</li>`).join('')}</ul>
          </div>
        </div>
        <div class="spacer"></div>
        <div class="panel">
          <div class="head"><h3>Cursos recomendados para ${state.dados.area || 'sua área'}</h3></div>
          <div class="course-list">
            ${feedback.next.map(course => `
              <div class="course-item">
                <div>
                  <strong>${course.name}</strong><br>
                  <small>${course.institution} • ${course.hours}h</small>
                </div>
                <a href="${course.url}" target="_blank" rel="noreferrer">Abrir</a>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function createSmartApplication(job) {
      const dados = state.dados;
      const pessoa = getCurrentPersona();
      const competencies = pessoa ? pessoa[2] : ['Comunicação', 'Organização'];
      const summary = dados.experiencias ? dados.experiencias.slice(0, 180) : 'Experiência acadêmica e interesse em crescer na área.';
      const texto = `
        <div class="panel">
          <div class="head"><h3>Candidatura inteligente para ${job.name}</h3></div>
          <p><strong>Perfil:</strong> ${dados.nome || 'Candidata'} • ${dados.area || 'Área em definição'}</p>
          <p><strong>Resumo:</strong> ${summary}</p>
          <p><strong>Competências em destaque:</strong> ${competencies.join(', ')}</p>
          <p><strong>Mensagem de apresentação:</strong> Olá! Meu nome é ${dados.nome || 'Joana'} e estou muito interessado(a) em ${job.name}. Tenho foco em ${job.areaLabel || 'área de interesse'}, com habilidades em ${competencies.join(', ')}. Quero contribuir com organização, comunicação e aprendizado contínuo, além de desenvolver resultados relevantes para a vaga e para a equipe.</p>
          <p><strong>Plano de ação:</strong> revisar o currículo, destacar os resultados, reforçar o perfil com 2 cursos e preparar exemplo prático para entrevista.</p>
        </div>
      `;

      state.candidaturas.push({
        nome: job.name,
        area: job.areaLabel,
        createdAt: new Date().toISOString(),
        texto: texto
      });
      save();
      renderDashboard();
      renderJobs();
      renderHome();

      const mentorBox = document.getElementById('screen-mentor');
      if (mentorBox) {
        const newMsg = { role: 'bot', text: `Sua candidatura inteligente para ${job.name} foi criada com resumo, perfil e plano de ação. Você pode usar esse conteúdo na entrevista ou para ajustar o currículo.` };
        state.mentorHistory.push(newMsg);
        save();
        renderMentor();
      }

      const wrapper = document.getElementById('screen-vagas');
      wrapper.insertAdjacentHTML('beforeend', texto);
    }

    function mentorReply(text) {
      const t = text.toLowerCase();
      if (t.includes('currículo') || t.includes('curriculo') || t.includes('cv')) {
        return 'Para deixar seu currículo forte, destaque resultados. Use verbos de ação e mostre impacto: “melhorei processo”, “reduzi tempo”, “aumentei eficiência”.';
      }
      if (t.includes('curso') || t.includes('aprend')) {
        return 'A melhor ordem é começar por cursos que fortalecem sua base e depois os específicos da área. Foque em comunicação, organização e habilidades técnicas relacionadas à vaga.';
      }
      if (t.includes('vaga') || t.includes('trabalho')) {
        return 'Uma boa candidatura tem três partes: perfil claro, evidência de resultados e alinhamento com a área. Mostre como você pode gerar valor para a empresa.';
      }
      if (t.includes('oi') || t.includes('olá') || t.includes('ola')) {
        return 'Olá! Posso te ajudar com planejamento de carreira, currículo, cursos, entrevista e as melhores ações para sua área.';
      }
      if (t.includes('entrevista')) {
        return 'Na entrevista, responda com situação, ação e resultado. Exemplo: “Eu identifiquei um problema, apliquei uma solução e obtenho resultado X”.';
      }
      return 'Sua melhor estratégia agora é identificar sua área, reforçar suas habilidades e transformar seu perfil em resultados claros para o mercado.';
    }

    function renderMentor() {
      const box = document.getElementById('screen-mentor');
      const messages = state.mentorHistory || [];
      box.innerHTML = `
        <div class="panel mentor-shell">
          <div class="head"><h2>Mentor IA</h2></div>
          <div class="messages">
            ${messages.map(msg => `<div class="msg ${msg.role === 'user' ? 'user' : 'bot'}">${esc(msg.text)}</div>`).join('')}
          </div>
          <form class="chat-form" id="mentor-form">
            <input id="mentor-input" type="text" placeholder="Pergunte ao seu mentor sobre carreira, currículo, cursos ou vagas">
            <button type="submit" class="btn">Enviar</button>
          </form>
        </div>
      `;

      document.getElementById('mentor-form').addEventListener('submit', e => {
        e.preventDefault();
        const input = document.getElementById('mentor-input');
        const value = input.value.trim();
        if (!value) return;
        state.mentorHistory.push({ role: 'user', text: value });
        state.mentorHistory.push({ role: 'bot', text: mentorReply(value) });
        save();
        renderMentor();
      });
    }

    function renderAll() {
      renderHome();
      renderPerfil();
      renderJobs();
      renderDashboard();
      renderMentor();
    }

    document.querySelectorAll('.nav button').forEach(btn => {
      btn.addEventListener('click', () => tab(btn.dataset.tab));
    });

    renderAll();
  </script>
</body>
</html>
