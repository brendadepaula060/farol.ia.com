<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Farol.IA — mentor de carreira</title>
  <style>
    :root {
      --bg: #091522;
      --bg-soft: #0f1d2c;
      --panel: #10243b;
      --panel-strong: #15314d;
      --field: #182f4a;
      --line: #2b4663;
      --gold: #f5a623;
      --light: #ffd280;
      --muted: #a8b8ca;
      --text: #ebf3ff;
      --green: #69c596;
      --danger: #ef8b8b;
      --shadow: rgba(6, 12, 18, 0.35);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: linear-gradient(180deg, #07131d 0%, #0d1d2b 100%);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    a { color: inherit; }
    button, input, select, textarea {
      font: inherit;
    }

    .top {
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(8px);
      background: rgba(9, 21, 34, 0.82);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .topin {
      max-width: 1180px;
      margin: 0 auto;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand {
      font-weight: 700;
      color: var(--light);
      font-size: clamp(1.15rem, 2vw, 1.6rem);
      letter-spacing: 0.03em;
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }

    .brand small {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.04em;
      font-weight: 600;
      text-transform: none;
      margin-top: 4px;
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .nav button,
    .primary,
    .secondary,
    .chip,
    .cta {
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      background: rgba(255,255,255,0.02);
      color: var(--text);
      padding: 10px 14px;
      cursor: pointer;
      transition: 180ms ease;
    }

    .nav button:hover,
    .primary:hover,
    .secondary:hover,
    .chip:hover,
    .cta:hover {
      transform: translateY(-1px);
      border-color: rgba(255,255,255,0.2);
    }

    .nav button.active,
    .primary,
    .cta {
      background: linear-gradient(135deg, var(--gold), #de9420);
      color: #172230;
      font-weight: 700;
      border-color: transparent;
      box-shadow: 0 12px 24px rgba(245,166,35,0.28);
    }

    .wrap {
      width: min(1180px, calc(100% - 24px));
      margin: 0 auto;
      padding: 24px 0 32px;
      flex: 1;
    }

    .screen {
      display: none;
      animation: fadeIn 0.25s ease;
    }

    .screen.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hero {
      background: linear-gradient(135deg, rgba(21,49,77,0.96), rgba(10,27,40,0.96));
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--radius);
      padding: clamp(20px, 4vw, 42px);
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top right, rgba(245,166,35,0.15), transparent 28%);
      pointer-events: none;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 0.82rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      color: var(--light);
      margin-bottom: 16px;
      position: relative;
      z-index: 1;
    }

    h1, h2, h3, p {
      margin: 0 0 12px;
    }

    .hero h1 {
      font-size: clamp(2.2rem, 4vw, 4rem);
      line-height: 1.05;
      position: relative;
      z-index: 1;
    }

    .hero p {
      color: var(--muted);
      max-width: 700px;
      font-size: 1.02rem;
      position: relative;
      z-index: 1;
    }

    .panel {
      background: rgba(16,36,59,0.96);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
      margin-top: 18px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }

    .field label {
      font-size: 0.92rem;
      color: var(--muted);
      font-weight: 600;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--field);
      color: var(--text);
      outline: none;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: rgba(245,166,35,0.65);
      box-shadow: 0 0 0 3px rgba(245,166,35,0.16);
    }

    .field textarea {
      min-height: 100px;
      resize: vertical;
    }

    .stack {
      display: grid;
      gap: 16px;
      margin-top: 18px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 18px;
    }

    .card {
      background: rgba(18, 38, 58, 0.95);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card h3 {
      margin: 0;
      color: var(--light);
      font-size: 1.1rem;
    }

    .card p,
    .hint,
    .tiny {
      color: var(--muted);
      margin: 0;
      line-height: 1.5;
    }

    .notice {
      background: rgba(105, 197, 150, 0.08);
      border: 1px solid rgba(105, 197, 150, 0.2);
      border-radius: 12px;
      color: #d7f5e5;
      padding: 12px 14px;
      margin-top: 12px;
    }

    .danger {
      background: rgba(239, 139, 139, 0.08);
      border: 1px solid rgba(239, 139, 139, 0.2);
      color: #f7d2d2;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-top: 20px;
    }

    .button-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .primary, .secondary, .chip, .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
    }

    .secondary {
      background: rgba(255,255,255,0.02);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .chip {
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.02);
      color: var(--muted);
      padding: 8px 12px;
      min-height: auto;
    }

    .job-item {
      background: rgba(18, 38, 58, 0.95);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 16px;
      margin-top: 12px;
      display: grid;
      gap: 12px;
    }

    .job-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .job-meta {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .job-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
    }

    .course-list,
    .job-list,
    .chat-box {
      display: grid;
      gap: 12px;
    }

    .course-item {
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.02);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .quiz-option {
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      color: var(--text);
      cursor: pointer;
      margin-top: 10px;
    }

    .quiz-option:hover,
    .quiz-option.selected {
      border-color: rgba(245,166,35,0.5);
      background: rgba(245,166,35,0.08);
    }

    .mentor-box {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .chat {
      background: rgba(9, 21, 34, 0.85);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 14px;
      min-height: 180px;
      max-height: 260px;
      overflow: auto;
      display: grid;
      gap: 10px;
    }

    .msg {
      max-width: 85%;
      border-radius: 12px;
      padding: 10px 12px;
      line-height: 1.45;
    }

    .msg.ai {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      color: var(--text);
      justify-self: start;
    }

    .msg.user {
      background: rgba(245,166,35,0.14);
      border: 1px solid rgba(245,166,35,0.25);
      color: #ffe9bf;
      justify-self: end;
    }

    .input-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .input-row input {
      flex: 1 1 220px;
      min-width: 0;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--field);
      color: var(--text);
    }

    .floating-next {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      width: min(420px, calc(100% - 24px));
      background: rgba(10, 24, 36, 0.95);
      border: 1px solid rgba(245,166,35,0.4);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      border-radius: 16px;
      padding: 10px;
      display: none;
      z-index: 20;
    }

    .floating-next.visible { display: block; }

    .floating-next button {
      width: 100%;
      border: none;
      border-radius: 12px;
      min-height: 46px;
      background: linear-gradient(135deg, var(--gold), #de9420);
      color: #172230;
      font-weight: 800;
      cursor: pointer;
    }

    footer {
      text-align: center;
      color: #7890a8;
      font-size: 12px;
      padding: 25px 16px 60px;
    }

    @media (max-width: 760px) {
      .topin {
        flex-direction: column;
        align-items: flex-start;
      }

      .nav {
        width: 100%;
        justify-content: flex-start;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .job-head {
        flex-direction: column;
        align-items: flex-start;
      }

      .job-actions {
        width: 100%;
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="topin">
      <div class="brand">farol.ia<small>mentor digital de carreira</small></div>
      <nav class="nav">
        <button data-tab="home" class="active">Início</button>
        <button data-tab="perfil">Perfil</button>
        <button data-tab="vagas">Vagas</button>
        <button data-tab="dashboard">Dashboard</button>
        <button data-tab="mentor">Mentor IA</button>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section id="screen-home" class="screen active"></section>
    <section id="screen-perfil" class="screen"></section>
    <section id="screen-vagas" class="screen"></section>
    <section id="screen-dashboard" class="screen"></section>
    <section id="screen-mentor" class="screen"></section>
  </main>

  <div id="floating-next" class="floating-next">
    <button type="button" id="floating-next-btn">Continuar</button>
  </div>

  <footer>Farol.IA — dados salvos localmente neste dispositivo.</footer>

  <script>
    'use strict';

    const areas = [
      'Administração e Finanças','Agricultura e Meio Ambiente','Artes e Design','Atendimento e Serviços',
      'Beleza e Estética','Comunicação e Marketing','Construção Civil','Educação e Formação',
      'Gastronomia e Hotelaria','Informática e Tecnologia','Saúde e Bem-Estar','Vendas e Comercial'
    ];

    const names = [
      ['Assistente Administrativo', 'Auxiliar Financeiro'],
      ['Assistente Agrícola', 'Técnico Ambiental'],
      ['Designer Gráfico', 'Produtor Cultural'],
      ['Recepcionista', 'Atendente de Serviços'],
      ['Esteticista', 'Cabeleireiro'],
      ['Assistente de Marketing', 'Social Media'],
      ['Pedreiro', 'Eletricista'],
      ['Monitor de Educação', 'Agente de Apoio Escolar'],
      ['Auxiliar de Cozinha', 'Atendimento em Hotelaria'],
      ['Suporte Técnico', 'Analista de Sistemas'],
      ['Técnico de Enfermagem', 'Recepcionista de Clínica'],
      ['Consultor de Vendas', 'Operador Comercial']
    ];

    const jobs = areas.flatMap((area, i) => names[i].map(name => ({ name, area })));

    const courses = {
      'Administração e Finanças': [['Excel Básico', 'Fundação Bradesco', 'https://www.ev.org.br/cursos'], ['Administração', 'Sebrae', 'https://www.sebrae.com.br/sites/PortalSebrae/curso']],
      'Agricultura e Meio Ambiente': [['Agricultura Familiar', 'Sebrae', 'https://www.sebrae.com.br/sites/PortalSebrae/curso'], ['Reciclagem e Sustentabilidade', 'Fundação Bradesco', 'https://www.ev.org.br/cursos']],
      'Artes e Design': [['Design Gráfico', 'Sebrae', 'https://www.sebrae.com.br/sites/PortalSebrae/curso'], ['Adobe Photoshop', 'Fundação Bradesco', 'https://www.ev.org.br/cursos']],
      'Atendimento e Serviços': [['Atendimento ao Cliente', 'Fundação Bradesco', 'https://www.ev.org.br/cursos'], ['Liderança de Equipe', 'Sebrae', 'https://www.sebrae.com.br/sites/PortalSebrae/curso']],
      'Beleza e Estética': [['Estética Facial', 'Sebrae', 'https://www.sebrae.com.br/sites/PortalSebrae/curso'], ['Cuidados com o Cliente', 'Fundação Bradesco', 'https://www.ev.org.br/cursos']],
      'Comunicação e Marketing': [['Marketing Digital', 'Sebrae', 'https://www.sebrae.com.br/sites/PortalSebrae/curso'], ['Redes Sociais', 'Fundação Bradesco', 'https://www.ev.org.br/cursos']],
      'Construção Civil': [['Segurança no Trabalho', 'Sebrae', 'https://www.sebrae.com.br/sites/PortalSebrae/curso'], ['Leitura de Projetos', 'Fundação Bradesco', 'https://www.ev.org.br/cursos']],
      'Educação e Formação': [['Educação Inclusiva', 'Fundação Bradesco', 'https://www.ev.org.br/cursos'], ['Metodologias de Ensino', 'Sebrae', 'https://www.sebrae.com.br/sites/PortalSebrae/curso']],
      'Gastronomia e Hotelaria': [['Atendimento em Gastronomia', 'Fundação Bradesco', 'https://www.ev.org.br/cursos'], ['Hospitalidade', 'Sebrae', 'https://www.sebrae.com.br/sites/PortalSebrae/curso']],
      'Informática e Tecnologia': [['Excel Básico', 'Fundação Bradesco', 'https://www.ev.org.br/cursos'], ['Fundamentos de TI', 'Sebrae', 'https://www.sebrae.com.br/sites/PortalSebrae/curso']],
      'Saúde e Bem-Estar': [['Primeiros Socorros', 'Fundação Bradesco', 'https://www.ev.org.br/cursos'], ['Atendimento em Saúde', 'Sebrae', 'https://www.sebrae.com.br/sites/PortalSebrae/curso']],
      'Vendas e Comercial': [['Vendas Consultivas', 'Fundação Bradesco', 'https://www.ev.org.br/cursos'], ['Negociação', 'Sebrae', 'https://www.sebrae.com.br/sites/PortalSebrae/curso']]
    };

    const Q = [
      ['O que mais combina com você?', ['Organizar processos', 'Criar e comunicar ideias', 'Ajudar pessoas', 'Resolver problemas com lógica']],
      ['Como você prefere aprender?', ['Praticando', 'Criando', 'Observando', 'Estudando teoria']],
      ['Qual tipo de ambiente você prefere?', ['Estruturado e organizado', 'Criativo e dinâmico', 'Com interação e relacionamento', 'Com desafio técnico']],
      ['Como você toma decisões?', ['Com lógica e dados', 'Com criatividade', 'Com empatia', 'Com atenção aos detalhes']]
    ];

    const DEFAULT = {
      dados: {
        nome: '', email: '', telefone: '', dataNascimento: '', formacao: '', instituicao: '', funcao: '', area: '', experiencias: '', idiomas: '', cursosComp: []
      },
      quiz: [],
      persona: null,
      candidaturas: [],
      chat: []
    };

    const $ = (id) => document.getElementById(id);

    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    function load() {
      try {
        const raw = localStorage.getItem('farolIA_state') || localStorage.getItem('farolIAState_v3');
        const old = raw ? JSON.parse(raw) : {};
        return { ...structuredClone(DEFAULT), ...old, dados: { ...structuredClone(DEFAULT.dados), ...(old.dados || {}) } };
      } catch (error) {
        return structuredClone(DEFAULT);
      }
    }

    let state = load();
    let openJob = null;

    function save() {
      localStorage.setItem('farolIA_state', JSON.stringify(state));
    }

    function clean(s) {
      return String(s || '').trim().replace(/\s+/g, ' ');
    }

    function showNextStep(target, label) {
      const floating = $('floating-next');
      const btn = $('floating-next-btn');
      if (!floating || !btn) return;
      btn.textContent = label;
      btn.onclick = () => tab(target);
      floating.classList.add('visible');
    }

    function hideNextStep() {
      const floating = $('floating-next');
      if (!floating) return;
      floating.classList.remove('visible');
    }

    function tab(name) {
      document.querySelectorAll('.screen').forEach((x) => x.classList.remove('active'));
      const screen = $('screen-' + name);
      if (screen) {
        screen.classList.add('active');
      }
      document.querySelectorAll('[data-tab]').forEach((x) => x.classList.toggle('active', x.dataset.tab === name));
      if (name !== 'perfil' && name !== 'vagas' && name !== 'dashboard' && name !== 'mentor') {
        hideNextStep();
      }
    }

    document.querySelectorAll('[data-tab]').forEach((x) => {
      x.onclick = () => tab(x.dataset.tab);
    });

    const fieldDefs = [
      ['nome', 'Nome completo', 'text'],
      ['email', 'E-mail', 'email'],
      ['telefone', 'Telefone', 'tel'],
      ['dataNascimento', 'Data de nascimento', 'date'],
      ['formacao', 'Formação', 'text'],
      ['instituicao', 'Instituição', 'text'],
      ['funcao', 'Função desejada', 'text'],
      ['area', 'Área de interesse', 'select'],
      ['experiencias', 'Experiências', 'textarea'],
      ['idiomas', 'Idiomas', 'text']
    ];

    function renderHome() {
      const container = $('screen-home');
      container.innerHTML = `
        <div class="hero">
          <span class="tag">🧭 mentor de carreira com IA</span>
          <h1>Seu caminho profissional começa aqui.</h1>
          <p>Cadastre-se, descubra seu potencial e receba oportunidades alinhadas ao seu perfil. O Farol.IA ajuda você a entender melhor seus talentos, objetivos e próximos passos.</p>
          <div class="button-bar" style="margin-top:18px;">
            <button class="primary" type="button" onclick="tab('perfil')">Começar agora</button>
            <button class="secondary" type="button" onclick="tab('dashboard')">Ver dashboard</button>
          </div>
        </div>

        <div class="cards">
          <div class="card">
            <h3>Perfil profissional</h3>
            <p>Organizamos seu histórico, competências e interesses em um diagnóstico simples e útil.</p>
          </div>
          <div class="card">
            <h3>Vagas personalizadas</h3>
            <p>Descubra funções que combinam mais com seu estilo, formação e objetivos.</p>
          </div>
          <div class="card">
            <h3>Mentor IA</h3>
            <p>Converse sobre currículo, entrevista, cursos e trajetória profissional.</p>
          </div>
        </div>
      `;
    }

    function renderProfile() {
      const node = $('screen-perfil');
      const complete = !!state.dados.nome;

      const formHtml = `
        <div class="panel">
          <h2>Cadastro de perfil</h2>
          <p class="hint">Preencha seus dados para montar um diagnóstico mais preciso e receber sugestões de carreira.</p>
          <form id="register">
            <div class="grid">
              ${fieldDefs.map(([key, label, type]) => {
                const value = key === 'area' ? state.dados.area || '' : state.dados[key] || '';
                if (type === 'select') {
                  return `
                    <div class="field">
                      <label for="d_${key}">${label}</label>
                      <select id="d_${key}">
                        <option value="">Selecione</option>
                        ${areas.map((area) => `<option value="${esc(area)}" ${value === area ? 'selected' : ''}>${esc(area)}</option>`).join('')}
                      </select>
                    </div>
                  `;
                }
                if (type === 'textarea') {
                  return `
                    <div class="field" style="grid-column: 1 / -1;">
                      <label for="d_${key}">${label}</label>
                      <textarea id="d_${key}">${esc(value)}</textarea>
                    </div>
                  `;
                }
                return `
                  <div class="field">
                    <label for="d_${key}">${label}</label>
                    <input id="d_${key}" type="${type}" value="${esc(value)}" />
                  </div>
                `;
              }).join('')}
            </div>

            <div class="toolbar">
              <div class="tiny">Você pode editar seus dados depois.</div>
              <div class="button-bar">
                <button class="primary" type="submit">Salvar perfil</button>
                <button class="secondary" type="button" onclick="tab('home')">Voltar</button>
              </div>
            </div>
          </form>
        </div>
      `;

      const diagnoseHtml = `
        <div class="stack">
          <div class="panel">
            <h2>Diagnóstico profissional</h2>
            <p class="hint">Responda algumas perguntas para descobrir melhor o seu perfil e as oportunidades que combinam com você.</p>
            <div class="button-bar">
              <button class="primary" type="button" onclick="startQuiz()">Iniciar diagnóstico</button>
              <button class="secondary" type="button" onclick="tab('home')">Voltar ao início</button>
            </div>
            ${state.persona ? `<div class="notice"><strong>Diagnóstico concluído:</strong> ${esc(state.persona)}</div>` : ''}
          </div>
        </div>
      `;

      node.innerHTML = complete ? diagnoseHtml + formHtml : formHtml + diagnoseHtml;

      const form = $('register');
      if (form) {
        form.onsubmit = (event) => {
          event.preventDefault();
          fieldDefs.forEach(([key, , type]) => {
            const valueNode = $('d_' + key);
            if (!valueNode) return;
            if (type === 'select') {
              state.dados[key] = valueNode.value.trim();
            } else {
              state.dados[key] = valueNode.value.trim();
            }
          });

          state.dados.cursosComp = Array.isArray(state.dados.cursosComp) ? state.dados.cursosComp : [];
          save();
          render();
          showNextStep('perfil', 'Continuar para o diagnóstico');
        };
      }
    }

    function startQuiz() {
      state.quiz = [];
      tab('perfil');
      const node = $('screen-perfil');
      node.innerHTML = `
        <div class="panel">
          <h2>Diagnóstico profissional</h2>
          <div id="quiz-box"></div>
        </div>
      `;
      renderQuiz();
    }

    function renderQuiz() {
      const box = $('quiz-box');
      if (!box) return;

      const currentIndex = state.quiz.length;
      if (currentIndex >= Q.length) {
        const perfilMap = ['Execução e organização', 'Criatividade e comunicação', 'Pessoas e impacto', 'Análise e tecnologia'];
        const answerSeed = (state.quiz[0] ?? 0) + (state.quiz[1] ?? 0) + (state.quiz[2] ?? 0) + (state.quiz[3] ?? 0);
        state.persona = perfilMap[answerSeed % perfilMap.length];
        save();
        render();
        showNextStep('vagas', 'Ver vagas recomendadas');
        return;
      }

      const [question, answers] = Q[currentIndex];
      box.innerHTML = `
        <p class="tiny">Pergunta ${currentIndex + 1} de ${Q.length}</p>
        <h3>${esc(question)}</h3>
        ${answers.map((answer, index) => `
          <button class="quiz-option ${state.quiz[currentIndex] === index ? 'selected' : ''}" type="button" data-answer="${index}">${esc(answer)}</button>
        `).join('')}
      `;

      box.querySelectorAll('.quiz-option').forEach((button) => {
        button.onclick = () => {
          const answerIndex = Number(button.dataset.answer);
          state.quiz[currentIndex] = answerIndex;
          save();
          renderQuiz();
        };
      });
    }

    function renderJobs() {
      const node = $('screen-vagas');
      if (!state.persona) {
        node.innerHTML = `
          <div class="panel">
            <h2>Vagas recomendadas</h2>
            <p class="hint">Complete o cadastro e faça o diagnóstico para receber vagas alinhadas ao seu perfil.</p>
            <div class="button-bar">
              <button class="primary" type="button" onclick="tab('perfil')">Ir para o perfil</button>
            </div>
          </div>
        `;
        return;
      }

      const filtered = jobs.filter((job) => {
        if (!state.dados.area) return true;
        return job.area === state.dados.area || job.area.includes(state.dados.area) || state.dados.area.includes(job.area);
      });

      const jobsHtml = filtered.slice(0, 8).map((job) => `
        <div class="job-item">
          <div class="job-head">
            <div>
              <h3>${esc(job.name)}</h3>
              <div class="job-meta">${esc(job.area)}</div>
            </div>
            <span class="chip">match ${Math.max(70, 90 - Math.abs((job.name.length % 10) - 3) * 2)}%</span>
          </div>
          <p class="hint">Perfil sugerido para pessoas com foco em ${esc(state.persona.toLowerCase())} e interesse em ${esc(job.area)}.</p>
          <div class="job-actions">
            <button class="primary" type="button" onclick="smart(${JSON.stringify(job).replace(/"/g, '&quot;')})">Salvar candidatura</button>
            <button class="secondary" type="button" onclick="window.open('https://www.google.com/search?q=${encodeURIComponent(job.name + ' ' + job.area)}', '_blank')">Ver vagas</button>
          </div>
        </div>
      `).join('');

      node.innerHTML = `
        <div class="panel">
          <h2>Vagas recomendadas</h2>
          <p class="hint">Sugestões com base no seu perfil e área de interesse.</p>
          ${jobsHtml || '<p class="hint">Nenhuma vaga foi encontrada no momento. Tente alterar sua área ou atualizar o cadastro.</p>'}
          <div class="button-bar" style="margin-top:20px;">
            <button class="primary" type="button" onclick="tab('dashboard')">Ir para dashboard</button>
            <button class="secondary" type="button" onclick="tab('perfil')">Editar perfil</button>
          </div>
        </div>
      `;

      showNextStep('dashboard', 'Continuar para o dashboard');
    }

    function smart(job) {
      const exists = state.candidaturas.some((x) => x.name === job.name);
      if (!exists) {
        state.candidaturas.push({
          name: job.name,
          area: job.area,
          date: new Date().toISOString(),
          summary: `Candidatura para ${job.name} na área de ${job.area}.`
        });
        save();
      }
      openJob = job;
      renderDashboard();
      tab('dashboard');
      showNextStep('dashboard', 'Continuar para o dashboard');
    }

    function renderDashboard() {
      const node = $('screen-dashboard');
      const area = state.dados.area || areas[0];
      const list = courses[area] || courses[areas[0]];

      node.innerHTML = `
        <div class="panel">
          <h2>Dashboard</h2>
          <p class="hint">Recomendações de cursos, objetivos e candidaturas.</p>

          <div class="cards">
            <div class="card">
              <h3>Perfil</h3>
              <p><strong>Nome:</strong> ${esc(state.dados.nome || 'Ainda não informado')}</p>
              <p><strong>Área:</strong> ${esc(state.dados.area || area)}</p>
              <p><strong>Perfil:</strong> ${esc(state.persona || 'Aguardando diagnóstico')}</p>
            </div>

            <div class="card">
              <h3>Candidaturas</h3>
              <p>${state.candidaturas.length ? `${state.candidaturas.length} vagas salvas` : 'Nenhuma candidatura salva ainda.'}</p>
              <p>${state.dados.cursosComp?.length ? `${state.dados.cursosComp.length} cursos marcados` : 'Sem cursos marcados.'}</p>
            </div>
          </div>

          <div class="stack">
            <div class="panel">
              <h3>Cursos recomendados</h3>
              <div class="course-list">
                ${list.map(([curso, provider, link]) => `
                  <div class="course-item">
                    <div>
                      <strong>${esc(curso)}</strong><br>
                      <span class="tiny">${esc(provider)}</span>
                    </div>
                    <a class="secondary" href="${esc(link)}" target="_blank" rel="noreferrer">Abrir</a>
                  </div>
                `).join('')}
              </div>
            </div>

            <div class="panel">
              <h3>Candidaturas salvas</h3>
              <div class="job-list">
                ${state.candidaturas.length ? state.candidaturas.map((job) => `
                  <div class="job-item">
                    <div class="job-head">
                      <div>
                        <h3>${esc(job.name)}</h3>
                        <div class="job-meta">${esc(job.area)}</div>
                      </div>
                    </div>
                    <p class="hint">${esc(job.summary || 'Candidatura salva para revisão posterior.')}</p>
                  </div>
                `).join('') : '<p class="hint">Ainda não há candidaturas salvas.</p>'}
              </div>
            </div>
          </div>

          <div class="button-bar" style="margin-top:20px;">
            <button class="primary" type="button" onclick="tab('mentor')">Falar com o mentor IA</button>
            <button class="secondary" type="button" onclick="tab('vagas')">Ver vagas</button>
          </div>
        </div>
      `;

      showNextStep('mentor', 'Continuar para o mentor IA');
    }

    function reply(text) {
      const t = text.toLowerCase();
      if (/^(oi|olá|ola|bom dia|boa tarde|boa noite)/.test(t)) return 'Olá! Como posso ajudar na sua carreira hoje?';
      if (t.includes('curr')) return 'Posso ajudar a melhorar seu currículo, deixando sua experiência mais clara e atraente para recrutadores.';
      if (t.includes('vaga') || t.includes('trabalho')) return 'Para escolher uma vaga, vale olhar a sua área, perfil e objetivos. O ideal é priorizar oportunidades que combinem com suas forças e potencial.';
      if (t.includes('curso') || t.includes('estudar')) return 'Você pode começar por cursos rápidos e práticos na sua área de interesse para ganhar confiança e aumentar suas chances.';
      if (t.includes('entrevista')) return 'Na entrevista, foque em exemplos práticos, clareza de comunicação e atitudes proativas. Mostre como você resolve problemas.';
      return 'Legal! O ideal é pensar em três passos: conhecer melhor seu perfil, alinhar suas forças com a área certa e construir uma rotina de estudo/trabalho focada.';
    }

    function renderMentor() {
      const node = $('screen-mentor');
      if (!state.chat.length) {
        state.chat = [
          { role: 'ai', text: 'Olá! Sou seu mentor de carreira. Posso ajudar com currículo, vagas, cursos e próximos passos.' }
        ];
      }

      node.innerHTML = `
        <div class="panel mentor-box">
          <h2>Mentor IA</h2>
          <p class="hint">Converse sobre carreira, cursos, currículo, entrevistas ou oportunidades.</p>
          <div class="chat" id="chat-box">
            ${state.chat.map((m) => `
              <div class="msg ${m.role === 'user' ? 'user' : 'ai'}">${esc(m.text)}</div>
            `).join('')}
          </div>
          <div class="input-row">
            <input id="mentor-input" type="text" placeholder="Digite sua dúvida sobre carreira..." />
            <button class="primary" type="button" id="send-mentor">Enviar</button>
          </div>
        </div>
      `;

      const input = $('mentor-input');
      const send = $('send-mentor');
      if (input && send) {
        send.onclick = () => {
          const value = clean(input.value);
          if (!value) return;
          state.chat.push({ role: 'user', text: value });
          state.chat.push({ role: 'ai', text: reply(value) });
          save();
          renderMentor();
        };

        input.addEventListener('keydown', (event) => {
          if (event.key === 'Enter') {
            send.click();
          }
        });
      }
    }

    function render() {
      renderHome();
      renderProfile();
      renderJobs();
      renderDashboard();
      renderMentor();
      if (!state.persona) {
        hideNextStep();
      }
    }

    tab('home');
    render();
  </script>
</body>
</html>
