<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Farol.IA — carreira com direção</title>
<style>
:root{--bg:#f5f8fb;--surface:#fff;--surface2:#eef4f8;--ink:#10283f;--ink2:#163b59;--text:#17324a;--muted:#71889c;--line:#dce7f0;--gold:#f5a623;--gold2:#ffd98a;--ok:#157347;--danger:#b42318;--shadow:rgba(16,40,63,.12)}
body.dark{--bg:#02070d;--surface:#0b121a;--surface2:#101b27;--ink:#edf7ff;--ink2:#dfeaf7;--text:#edf7ff;--muted:#9db1c5;--line:#1f2d3d;--shadow:rgba(0,0,0,.72)}
*{box-sizing:border-box}html,body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text);transition:.2s}button,input,select,textarea{font:inherit}header{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}.top{max-width:1180px;margin:auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-size:1.45rem;font-weight:900;color:var(--gold2)}.brand small{display:block;color:var(--muted);font-size:.66rem}.nav{display:flex;flex-wrap:wrap;gap:8px}.nav button,.btn{border:0;border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:700}.nav button{background:transparent;color:var(--ink)}.nav button.active{background:var(--gold);color:#172b3c}.theme-btn,.btn.secondary{background:var(--surface2);color:var(--text)}main{max-width:1180px;margin:auto;padding:28px 20px 68px}.screen{display:none}.screen.active{display:block}.hero{padding:28px;border-radius:24px;background:linear-gradient(120deg,#10283f,#205273);color:#fff}.hero h1{font-size:clamp(2.4rem,6vw,5rem);line-height:.98;margin:16px 0}.hero p{max-width:680px;line-height:1.7;color:#d3e3ef}.tag,.eyebrow{color:var(--gold2);font-weight:800;text-transform:uppercase;font-size:.74rem;letter-spacing:.1em}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn.primary{background:var(--gold);color:#172b3c}.cards,.grid{display:grid;gap:16px}.cards{grid-template-columns:repeat(3,1fr);margin-top:26px}.grid{grid-template-columns:repeat(2,1fr)}.card,.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:21px;box-shadow:0 10px 28px var(--shadow)}.panel{margin-top:18px}.card h3,.panel h2{margin:0 0 10px;color:var(--ink2)}.card p,.panel p,.meta{color:var(--muted);line-height:1.6}.field{display:flex;flex-direction:column;gap:7px;margin:12px 0}.field label{font-weight:700}.required-mark{color:var(--danger);margin-left:4px}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface);color:var(--text)}.field textarea{min-height:115px;resize:vertical}.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--danger)}.checkgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.check{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);cursor:pointer}.check input{margin-right:8px}.job,.history-item{padding:18px;border:1px solid var(--line);border-radius:15px;background:var(--surface2);margin-top:12px}.status{background:#e8f7ef;color:var(--ok);padding:5px 9px;border-radius:20px;font-size:.76rem;font-weight:800}.course{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.course:last-child{border-bottom:0}.toast{position:fixed;right:18px;bottom:18px;z-index:30;background:#143e2b;color:#fff;padding:14px 17px;border-radius:12px;display:none}.toast.show{display:block}@media(max-width:760px){.top{flex-direction:column;align-items:flex-start}.cards,.grid{grid-template-columns:1fr}.course{align-items:flex-start;flex-direction:column}}
@media print{header,.nav,.screen:not(#curriculo),.actions,.toast{display:none!important}body,main,#curriculo{background:#fff!important;color:#111!important;margin:0;padding:0;max-width:none}.panel,.card{box-shadow:none!important;border:0!important;background:#fff!important}.eyebrow,.meta,.card p,.panel p{color:#333!important}}
</style>
</head>
<body>
<header><div class="top"><div class="brand">farol.ia<small>carreira com direção</small></div><nav class="nav"><button data-tab="home">Início</button><button data-tab="perfil">Meu perfil</button><button data-tab="vagas">Vagas</button><button data-tab="curriculo">Currículo</button><button data-tab="historico">Histórico</button><button id="themeToggle" class="theme-btn" type="button">☀️ Claro</button></nav></div></header>
<main><section id="home" class="screen"></section><section id="perfil" class="screen"></section><section id="vagas" class="screen"></section><section id="curriculo" class="screen"></section><section id="historico" class="screen"></section></main><div id="toast" class="toast"></div>
<script>
'use strict';
const API='/api';
const areas=['Administração e Finanças','Agricultura e Meio Ambiente','Artes e Design','Atendimento e Serviços','Beleza e Estética','Comunicação e Marketing','Construção Civil','Educação e Formação','Gastronomia e Hotelaria','Informática e Tecnologia','Saúde e Bem-Estar','Vendas e Comercial'];
const courses={'Administração e Finanças':['Excel Básico','Administração'],'Comunicação e Marketing':['Marketing Digital','Redes Sociais'],'Informática e Tecnologia':['Excel Básico','Fundamentos de TI'],'Atendimento e Serviços':['Atendimento ao Cliente','Liderança de Equipe'],'Vendas e Comercial':['Vendas Consultivas','Negociação'],'Saúde e Bem-Estar':['Primeiros Socorros','Atendimento em Saúde']};
const links={'Excel Básico':'https://www.ev.org.br/cursos','Administração':'https://www.sebrae.com.br/sites/PortalSebrae/cursos','Marketing Digital':'https://www.sebrae.com.br/sites/PortalSebrae/cursos','Redes Sociais':'https://www.ev.org.br/cursos','Fundamentos de TI':'https://www.ev.org.br/cursos','Atendimento ao Cliente':'https://www.ev.org.br/cursos','Liderança de Equipe':'https://www.sebrae.com.br/sites/PortalSebrae/cursos','Vendas Consultivas':'https://www.sebrae.com.br/sites/PortalSebrae/cursos','Negociação':'https://www.ev.org.br/cursos','Primeiros Socorros':'https://www.ev.org.br/cursos','Atendimento em Saúde':'https://www.ev.org.br/cursos'};
const jobs=[['Assistente Administrativo','Administração e Finanças',['Excel Básico','Administração']],['Assistente de Marketing','Comunicação e Marketing',['Marketing Digital','Redes Sociais']],['Suporte Técnico','Informática e Tecnologia',['Excel Básico','Fundamentos de TI']],['Atendente de Serviços','Atendimento e Serviços',['Atendimento ao Cliente','Liderança de Equipe']],['Consultor de Vendas','Vendas e Comercial',['Vendas Consultivas','Negociação']],['Técnico de Enfermagem','Saúde e Bem-Estar',['Primeiros Socorros','Atendimento em Saúde']]];
const blank={nome:'',email:'',telefone:'',dataNascimento:'',formacao:'',instituicao:'',funcao:'',area:'',experiencias:'',idiomas:'',cursos:'',cursosSalvos:[],candidaturas:[]};let state={...blank};let selectedJob=null;const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(text,bad=false){const n=$('toast');n.textContent=text;n.style.background=bad?'#8e2c25':'#143e2b';n.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>n.classList.remove('show'),2500)}
async function request(path,options={}){const r=await fetch(API+path,{headers:{'Content-Type':'application/json'},...options});if(!r.ok)throw new Error(await r.text()||'Falha no servidor');return r.status===204?null:r.json()}
function setTheme(theme){const dark=theme==='dark';document.body.classList.toggle('dark',dark);localStorage.setItem('farol-theme',theme);$('themeToggle').textContent=dark?'🌙 Dark':'☀️ Claro'}
async function loadData(){if(!state.email)return;try{const d=await request('/profile?email='+encodeURIComponent(state.email));state=d&&d.profile?{...blank,...d.profile,candidaturas:d.applications||[]}:{...blank,email:state.email};renderProfile()}catch(e){toast('Não foi possível carregar o perfil.',true)}}
async function saveProfile(){try{const d=await request('/profile',{method:'PUT',body:JSON.stringify(state)});if(d&&d.profile)state={...state,...d.profile,candidaturas:d.applications||state.candidaturas};toast('Perfil salvo no servidor!');return true}catch(e){toast('Erro na API: '+(e.message||'não foi possível salvar.'),true);return false}}
function tab(name){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(name).classList.add('active');document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===name));({home:renderHome,perfil:renderProfile,vagas:renderJobs,curriculo:renderResume,historico:renderHistory}[name]||(()=>{}))()}
function renderHome(){$('home').innerHTML='<div class="hero"><span class="tag">🧭 mentor digital de carreira</span><h1>Um currículo forte abre portas.</h1><p>Crie uma apresentação profissional, adapte seu currículo às vagas, encontre cursos gratuitos e acompanhe suas candidaturas.</p><div class="actions"><button class="btn primary" onclick="tab(\'perfil\')">Montar meu perfil</button><button class="btn secondary" onclick="tab(\'vagas\')">Explorar vagas</button></div></div><div class="cards"><div class="card"><h3>CV profissional</h3><p>Layout completo, legível e pronto para PDF.</p></div><div class="card"><h3>Candidatura inteligente</h3><p>Veja requisitos faltantes e cursos recomendados para cada vaga.</p></div><div class="card"><h3>Mentor de carreira</h3><p>Escolha sua área e encontre caminhos de desenvolvimento.</p></div></div>'}
function renderProfile(){const defs=[['nome','Nome completo','text',true],['email','E-mail','email',true],['telefone','Telefone','tel',false],['dataNascimento','Data de nascimento','date',false],['formacao','Formação','text',false],['instituicao','Instituição','text',false],['funcao','Função desejada','text',true],['area','Área de interesse','select',true],['experiencias','Experiências e competências','textarea',false],['idiomas','Idiomas','text',false],['cursos','Cursos realizados','text',false]];const fields=defs.map(([key,label,type,required])=>{const value=state[key]||'';const mark=required?'<span class="required-mark">*</span>':'';if(type==='select')return `<div class="field"><label for="f_${key}">${label}${mark}</label><select id="f_${key}"${required?' required':''}><option value="">Selecione...</option>${areas.map(a=>`<option value="${esc(a)}"${a===value?' selected':''}>${esc(a)}</option>`).join('')}</select></div>`;if(type==='textarea')return `<div class="field" style="grid-column:1/-1"><label for="f_${key}">${label}${mark}</label><textarea id="f_${key}"${required?' required':''}>${esc(value)}</textarea></div>`;return `<div class="field"><label for="f_${key}">${label}${mark}</label><input id="f_${key}" type="${type}" value="${esc(value)}"${required?' required':''}></div>`}).join('');const list=courses[state.area]||[];$('perfil').innerHTML=`<div class="panel"><span class="eyebrow">Meu espaço</span><h2>Seu perfil profissional</h2><p class="meta">Os campos marcados com <span class="required-mark">*</span> são obrigatórios. As informações ficam salvas no servidor.</p><form id="perfilForm" novalidate><div class="grid">${fields}</div><h3>Meus cursos</h3><div class="checkgrid" id="courseChecks">${list.length?list.map(name=>`<label class="check"><input type="checkbox" value="${esc(name)}"${(state.cursosSalvos||[]).includes(name)?' checked':''}>${esc(name)}</label>`).join(''):'<span class="meta">Escolha uma área para ver cursos recomendados.</span>'}</div><div class="actions"><button class="btn primary" type="submit">Salvar no servidor</button><button class="btn secondary" type="button" onclick="tab('curriculo')">Ver currículo</button></div></form></div>`;const area=$('f_area');if(area)area.onchange=()=>{state.area=area.value;renderProfile()};$('perfilForm').onsubmit=async e=>{e.preventDefault();let valid=true;defs.forEach(([key,, ,required])=>{const el=$('f_'+key);if(el){state[key]=el.value.trim();const missing=required&&!state[key];el.closest('.field').classList.toggle('invalid',missing);if(missing)valid=false}});state.cursosSalvos=[...document.querySelectorAll('#courseChecks input:checked')].map(x=>x.value);if(!valid){toast('Preencha todos os campos obrigatórios.',true);return}const ok=await saveProfile();if(ok)renderProfile()}}
function missing(job){const text=`${state.experiencias} ${state.cursos} ${state.funcao} ${(state.cursosSalvos||[]).join(' ')}`.toLowerCase();return job[2].filter(x=>!text.includes(x.toLowerCase()))}
async function saveApplication(job,status='Candidatura iniciada'){try{const d=await request('/applications',{method:'POST',body:JSON.stringify({email:state.email,job,missing:missing(job),status})});state.candidaturas=d?.applications||state.candidaturas;toast(status==='Salva'?'Vaga salva no histórico.':'Candidatura registrada!');return true}catch(e){toast('Não foi possível salvar a candidatura.',true);return false}}
async function apply(job){if(!state.nome||!state.email||!state.funcao||!state.area){toast('Complete os campos obrigatórios do perfil.',true);tab('perfil');return}if(await saveApplication(job)){selectedJob=job;tab('curriculo')}}
function renderJobs(){if(!state.email||!state.area){$('vagas').innerHTML='<div class="panel"><h2>Vagas recomendadas</h2><p class="meta">Complete e salve seu perfil para receber oportunidades.</p><button class="btn primary" onclick="tab(\'perfil\')">Ir para o perfil</button></div>';return}const list=jobs.filter(j=>j[1]===state.area);$('vagas').innerHTML=`<div class="panel"><span class="eyebrow">Próximo passo</span><h2>Vagas para ${esc(state.area)}</h2><p class="meta">A IA de carreira compara seu perfil com os requisitos e recomenda cursos quando falta algum conhecimento.</p>${list.length?list.map(j=>{const miss=missing(j);return `<div class="job"><h3>${esc(j[0])}</h3><p class="meta">${esc(j[1])} • Requisitos: ${esc(j[2].join(', '))}</p>${miss.length?`<p class="meta"><b>Cursos a desenvolver:</b> ${miss.map(x=>`<a href="${links[x]||'#'}" target="_blank">${esc(x)}</a>`).join(', ')}</p>`:'<span class="status">Perfil compatível</span>'}<div class="actions"><button class="btn primary" onclick='apply(${JSON.stringify(j)})'>Candidatar-se com CV</button><button class="btn secondary" onclick='saveApplication(${JSON.stringify(j)},"Salva")'>Salvar vaga</button></div></div>`}).join(''):'<p class="meta">Nenhuma vaga encontrada.</p>'}</div>`}
function exportCV(){const w=window.open('','_blank');if(!w)return toast('Permita pop-ups para gerar o PDF.',true);w.document.write(`<html><head><title>CV - ${esc(state.nome||'Currículo')}</title><style>body{font-family:Arial;margin:0;color:#172b3c}main{max-width:800px;margin:auto;display:grid;grid-template-columns:220px 1fr;min-height:1050px}aside{background:#10283f;color:#fff;padding:32px 22px}article{padding:38px}h1{font-size:30px;margin:0 0 8px}h2{font-size:16px;text-transform:uppercase;color:#163b59;border-bottom:2px solid #f5a623;padding-bottom:7px;margin-top:28px}h3{margin:0 0 7px}p{line-height:1.6;margin:7px 0}.side-title{color:#ffd98a;text-transform:uppercase;font-size:12px;margin-top:28px}.side-text{color:#d9e5ef;font-size:13px}@media print{body{margin:0}}</style></head><body><main><aside><h1>${esc(state.nome||'Seu nome')}</h1><p class="side-text">${esc(state.funcao||'Profissional')}</p><div class="side-title">Contato</div><p class="side-text">${esc(state.email||'')}<br>${esc(state.telefone||'')}</p><div class="side-title">Área</div><p class="side-text">${esc(state.area||'')}</p><div class="side-title">Idiomas</div><p class="side-text">${esc(state.idiomas||'Não informado')}</p><div class="side-title">Cursos</div><p class="side-text">${esc(state.cursos||'Não informado')}<br>${(state.cursosSalvos||[]).map(esc).join('<br>')}</p></aside><article><h2>Resumo profissional</h2><p>${esc(state.experiencias||'Adicione suas experiências e competências.')}</p><h2>Formação</h2><h3>${esc(state.formacao||'Não informada')}</h3><p>${esc(state.instituicao||'')}</p><h2>Objetivo profissional</h2><p>${esc(state.funcao||'Não informado')} em ${esc(state.area||'sua área de interesse')}.</p></article></main><script>window.onload=()=>{window.print()}<\/script></body></html>`);w.document.close()}
function renderResume(){const job=selectedJob,miss=job?missing(job):[];$('curriculo').innerHTML=`<div class="panel"><span class="eyebrow">Apresentação profissional</span><h2>${job?'CV adaptado para '+esc(job[0]):'Seu CV profissional'}</h2>${miss.length?`<div class="job"><b>Recomendações:</b> ${miss.map(x=>`<a href="${links[x]||'#'}" target="_blank">${esc(x)}</a>`).join(' • ')}</div>`:''}<div class="card" style="margin-top:16px"><h3>${esc(state.nome||'Seu nome')}</h3><p>${esc(state.funcao||'Profissão')} • ${esc(state.area||'Área')}</p><p>${esc(state.email||'')}<br>${esc(state.telefone||'')}</p><h3>Resumo profissional</h3><p>${esc(state.experiencias||'Preencha suas experiências no perfil.')}</p><h3>Formação</h3><p>${esc(state.formacao||'Não informada')} ${state.instituicao?'— '+esc(state.instituicao):''}</p><h3>Cursos</h3><p>${esc(state.cursos||'')} ${(state.cursosSalvos||[]).map(esc).join(' • ')}</p></div><div class="actions"><button class="btn primary" onclick="exportCV()">Baixar currículo em PDF</button><button class="btn secondary" onclick="tab('perfil')">Editar dados</button></div></div>`}
async function renderHistory(){if(!state.email){$('historico').innerHTML='<div class="panel"><h2>Histórico de candidaturas</h2><p class="meta">Salve seu perfil para consultar seu histórico.</p></div>';return}try{const d=await request('/applications?email='+encodeURIComponent(state.email));state.candidaturas=d?.applications||[];$('historico').innerHTML=`<div class="panel"><span class="eyebrow">Acompanhamento</span><h2>Histórico de candidaturas</h2>${state.candidaturas.length?state.candidaturas.map(a=>`<div class="history-item"><b>${esc(a.job?.[0]||a.job?.name||a.job?.nome||'Vaga')}</b><div class="meta">${esc(a.job?.[1]||a.job?.area||'')} • ${new Date(a.created_at||Date.now()).toLocaleDateString('pt-BR')}</div><span class="status">${esc(a.status||'Salva')}</span></div>`).join(''):'<p class="meta">Nenhuma candidatura registrada ainda.</p>'}</div>`}catch(e){toast('Não foi possível buscar o histórico.',true)}}
document.addEventListener('DOMContentLoaded',()=>{setTheme(localStorage.getItem('farol-theme')||'light');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));$('themeToggle').onclick=()=>setTheme(document.body.classList.contains('dark')?'light':'dark');const email=localStorage.getItem('farol-email');if(email)state.email=email;renderHome();renderProfile();tab('home');if(state.email)loadData()});window.addEventListener('beforeunload',()=>{if(state.email)localStorage.setItem('farol-email',state.email)});
</script></body></html>
