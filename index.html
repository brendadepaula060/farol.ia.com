<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Farol.IA — mentor de carreira</title>
  <style>
    :root{--bg:#071522;--panel:#102840;--panel2:#153653;--line:#2d4b68;--gold:#f5a623;--text:#edf5ff;--muted:#a9bdd1;--ok:#73d3a0;--bad:#ff9c9c}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#071522,#102d46);color:var(--text);font:15px Arial,sans-serif;min-height:100vh}header{position:sticky;top:0;z-index:5;background:#091b2beF;border-bottom:1px solid #ffffff18}.top{max-width:1100px;margin:auto;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{font-size:1.35rem;font-weight:800;color:#ffd280}.brand small{display:block;color:var(--muted);font-size:.7rem;font-weight:400;margin-top:3px}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav button,.btn{border:1px solid #ffffff1c;border-radius:10px;padding:10px 14px;background:#ffffff08;color:var(--text);cursor:pointer;font-weight:700}.nav button.active,.btn.primary{background:linear-gradient(135deg,var(--gold),#d98d16);color:#172432;border:0}.btn:hover,.nav button:hover{filter:brightness(1.12);transform:translateY(-1px)}main{max-width:1100px;margin:auto;padding:25px 16px 50px}.screen{display:none}.screen.active{display:block;animation:show .2s ease}@keyframes show{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}.hero,.panel,.card{background:#102840ed;border:1px solid #ffffff12;border-radius:18px;box-shadow:0 16px 35px #0003}.hero{padding:clamp(24px,5vw,55px);background:radial-gradient(circle at 90% 5%,#f5a62322,transparent 30%),#102840}.hero h1{font-size:clamp(2rem,6vw,4rem);max-width:700px;line-height:1.03;margin:12px 0}.hero p{max-width:680px;color:var(--muted);line-height:1.6}.panel{padding:20px;margin-top:18px}.cards,.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;margin-top:16px}.cards{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}.card{padding:18px}.card h3{margin-top:0;color:#ffd280}.hint,.tiny{color:var(--muted);line-height:1.5}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:13px}.field label{font-weight:700;color:#c6d6e6}.field input,.field textarea,.field select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#183650;color:var(--text);font:inherit}.field textarea{min-height:100px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid #f5a62388}.required{color:#ffbc63}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.notice{padding:12px 14px;border-radius:10px;margin:12px 0;background:#73d3a014;border:1px solid #73d3a044;color:#d9f8e7}.notice.bad{background:#ff9c9c12;border-color:#ff9c9c55;color:#ffd6d6}.toast{position:fixed;right:18px;bottom:18px;z-index:20;max-width:360px;padding:14px 17px;border-radius:12px;background:#173f32;color:#e5fff0;border:1px solid #73d3a0;box-shadow:0 12px 30px #0006;display:none}.toast.show{display:block;animation:show .2s}.job{border:1px solid #ffffff14;border-radius:14px;padding:16px;margin-top:12px;background:#ffffff05}.job h3{margin:0 0 6px}.meta{color:var(--muted);font-size:.9rem}.course{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:13px 0;border-bottom:1px solid #ffffff12}.resume{background:#fff;color:#172333;border-radius:12px;padding:28px;max-width:850px;margin-top:15px}.resume h2,.resume h3{color:#153653}.resume .resume-head{border-bottom:3px solid var(--gold);padding-bottom:15px;margin-bottom:18px}.resume p{line-height:1.5}.pill{display:inline-block;padding:5px 9px;background:#e6a52b33;color:#684309;border-radius:999px;margin:3px;font-size:.85rem}footer{text-align:center;color:#7890a8;padding:20px}.check{display:flex;gap:10px;align-items:center;margin:10px 0}.check input{accent-color:var(--gold)}@media(max-width:700px){.top{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.nav{width:100%}.nav button{flex:1}}
  </style>
</head>
<body>
<header><div class="top"><div class="brand">farol.ia<small>mentor digital de carreira</small></div><nav class="nav"><button data-tab="home">Início</button><button data-tab="perfil">Meu perfil</button><button data-tab="vagas">Vagas</button><button data-tab="curriculo">Currículo</button></nav></div></header>
<main><section id="home" class="screen"></section><section id="perfil" class="screen"></section><section id="vagas" class="screen"></section><section id="curriculo" class="screen"></section></main><div id="toast" class="toast"></div><footer>Farol.IA — seus dados ficam salvos neste dispositivo.</footer>
<script>
'use strict';
const areas=['Administração e Finanças','Agricultura e Meio Ambiente','Artes e Design','Atendimento e Serviços','Beleza e Estética','Comunicação e Marketing','Construção Civil','Educação e Formação','Gastronomia e Hotelaria','Informática e Tecnologia','Saúde e Bem-Estar','Vendas e Comercial'];
const jobs=[
 {name:'Assistente Administrativo',area:'Administração e Finanças',req:['Excel Básico','Administração']},
 {name:'Assistente de Marketing',area:'Comunicação e Marketing',req:['Marketing Digital','Redes Sociais']},
 {name:'Suporte Técnico',area:'Informática e Tecnologia',req:['Excel Básico','Fundamentos de TI']},
 {name:'Atendente de Serviços',area:'Atendimento e Serviços',req:['Atendimento ao Cliente','Liderança de Equipe']},
 {name:'Consultor de Vendas',area:'Vendas e Comercial',req:['Vendas Consultivas','Negociação']},
 {name:'Técnico de Enfermagem',area:'Saúde e Bem-Estar',req:['Primeiros Socorros','Atendimento em Saúde']}
];
const courses={
'Administração e Finanças':['Excel Básico','Administração'],'Comunicação e Marketing':['Marketing Digital','Redes Sociais'],'Informática e Tecnologia':['Excel Básico','Fundamentos de TI'],'Atendimento e Serviços':['Atendimento ao Cliente','Liderança de Equipe'],'Vendas e Comercial':['Vendas Consultivas','Negociação'],'Saúde e Bem-Estar':['Primeiros Socorros','Atendimento em Saúde']};
const links={'Excel Básico':'https://www.ev.org.br/cursos','Administração':'https://www.sebrae.com.br/sites/PortalSebrae/curso','Marketing Digital':'https://www.sebrae.com.br/sites/PortalSebrae/curso','Redes Sociais':'https://www.ev.org.br/cursos','Fundamentos de TI':'https://www.ev.org.br/cursos','Atendimento ao Cliente':'https://www.ev.org.br/cursos','Liderança de Equipe':'https://www.sebrae.com.br/sites/PortalSebrae/curso','Vendas Consultivas':'https://www.sebrae.com.br/sites/PortalSebrae/curso','Negociação':'https://www.ev.org.br/cursos','Primeiros Socorros':'https://www.ev.org.br/cursos','Atendimento em Saúde':'https://www.sebrae.com.br/sites/PortalSebrae/curso'};
const blank={nome:'',email:'',telefone:'',dataNascimento:'',formacao:'',instituicao:'',funcao:'',area:'',experiencias:'',idiomas:'',cursos:''};
let state=(()=>{try{return {...blank,...JSON.parse(localStorage.getItem('farolIA_profile')||'{}')}}catch(e){return {...blank}}})();
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(text,bad=false){const n=$('toast');n.textContent=text;n.style.background=bad?'#532d32':'#173f32';n.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>n.classList.remove('show'),4500)}
function save(){localStorage.setItem('farolIA_profile',JSON.stringify(state))}
function tab(name){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(name).classList.add('active');document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===name));render(name)}
document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>tab(x.dataset.tab));
function renderHome(){
 $('home').innerHTML=`<div class="hero"><span>🧭 mentor de carreira com IA</span><h1>Seu caminho profissional começa aqui.</h1><p>Organize seu perfil, gere um currículo bonito e veja como cada vaga pode ser adaptada à sua experiência.</p><div class="actions"><button class="btn primary" onclick="tab('perfil')">Completar meu perfil</button><button class="btn" onclick="tab('vagas')">Ver vagas</button></div></div><div class="cards"><div class="card"><h3>Perfil completo</h3><p class="hint">Campos obrigatórios, validação e confirmação clara ao salvar.</p></div><div class="card"><h3>Currículo pronto</h3><p class="hint">Visual profissional e download em PDF pelo próprio navegador.</p></div><div class="card"><h3>Candidatura inteligente</h3><p class="hint">Currículo adaptado para a vaga e cursos gratuitos para os requisitos que faltarem.</p></div></div>`;
}
function renderProfile(){
 const defs=[['nome','Nome completo','text'],['email','E-mail','email'],['telefone','Telefone','tel'],['dataNascimento','Data de nascimento','date'],['formacao','Formação','text'],['instituicao','Instituição','text'],['funcao','Função desejada','text'],['area','Área de interesse','select'],['experiencias','Experiências e competências','textarea'],['idiomas','Idiomas','text'],['cursos','Cursos que você já fez','text']];
 const fields=defs.map(([key,label,type])=>{const req=['nome','email','funcao','area'].includes(key)?' required':'';const star=req?' <span class="required">*</span>':'';if(type==='select')return `<div class="field"><label for="f_${key}">${label}${star}</label><select id="f_${key}"${req}><option value="">Selecione</option>${areas.map(a=>`<option ${state[key]===a?'selected':''}>${a}</option>`).join('')}</select></div>`;if(type==='textarea')return `<div class="field" style="grid-column:1/-1"><label for="f_${key}">${label}${star}</label><textarea id="f_${key}"${req}>${esc(state[key])}</textarea></div>`;return `<div class="field"><label for="f_${key}">${label}${star}</label><input id="f_${key}" type="${type}" value="${esc(state[key])}"${req}></div>`}).join('');
 $('perfil').innerHTML=`<div class="panel"><h2>Meu perfil</h2><p class="hint">Os campos marcados com <span class="required">*</span> são obrigatórios.</p><form id="profileForm"><div class="grid">${fields}</div><div class="actions"><button class="btn primary" type="submit">Salvar perfil</button><button class="btn" type="button" onclick="tab('curriculo')">Ver currículo</button></div></form></div><div class="panel"><h3>Como funciona o e-mail?</h3><p class="hint">Como este é um site estático, o navegador não envia e-mails sozinho. Depois de salvar, o Farol.IA oferece um botão para abrir seu aplicativo de e-mail com a confirmação preenchida.</p></div>`;
 $('profileForm').onsubmit=e=>{e.preventDefault();if(!e.target.reportValidity())return;defs.forEach(([key])=>state[key]=$('f_'+key).value.trim());save();toast('Perfil salvo com sucesso!');renderProfile()};
}
function courseCard(name){return `<div class="course"><span><strong>${esc(name)}</strong><br><small class="meta">Curso gratuito recomendado</small></span><a class="btn" href="${links[name]||'https://www.ev.org.br/cursos'}" target="_blank" rel="noreferrer">Ver curso</a></div>`}
function adapted(job){const have=(state.cursos||'').toLowerCase();const missing=job.req.filter(x=>!have.includes(x.toLowerCase())&&!String(state.experiencias).toLowerCase().includes(x.toLowerCase()));const summary=`Profissional ${state.funcao||'em desenvolvimento'} com interesse em ${job.area}. ${state.experiencias||'Perfil motivado, organizado e preparado para aprender.'}`;return {missing,summary}}
function apply(job){if(!state.nome||!state.email||!state.funcao||!state.area){toast('Complete e salve os campos obrigatórios do perfil antes de se candidatar.',true);tab('perfil');return}const a=adapted(job);$('curriculo').innerHTML=`<div class="panel"><h2>Candidatura inteligente: ${esc(job.name)}</h2><p class="hint">Seu currículo foi ajustado com foco nos requisitos desta vaga.</p>${a.missing.length?`<div class="notice"><strong>Para aumentar suas chances:</strong><p>Você ainda pode desenvolver: ${a.missing.map(esc).join(', ')}.</p>${a.missing.map(courseCard).join('')}</div>`:'<div class="notice">Seu perfil já contempla os principais requisitos desta vaga.</div>'}<div class="resume"><div class="resume-head"><h2>${esc(state.nome)}</h2><p>${esc(state.email)}${state.telefone?' · '+esc(state.telefone):''}</p><strong>${esc(job.name)} · ${esc(job.area)}</strong></div><h3>Resumo profissional</h3><p>${esc(a.summary)}</p><h3>Formação</h3><p>${esc(state.formacao||'Formação não informada')}${state.instituicao?' — '+esc(state.instituicao):''}</p><h3>Competências e experiências</h3><p>${esc(state.experiencias||'Adicione suas experiências no perfil.')}</p><h3>Idiomas</h3><p>${esc(state.idiomas||'Não informado')}</p></div><div class="actions"><button class="btn primary" onclick="downloadResume('${esc(job.name)}')">Baixar currículo em PDF</button><button class="btn" onclick="sendConfirmation()">Enviar confirmação por e-mail</button><button class="btn" onclick="tab('vagas')">Voltar às vagas</button></div></div>`;tab('curriculo')}
function renderJobs(){const list=jobs.filter(j=>!state.area||j.area===state.area);$('vagas').innerHTML=`<div class="panel"><h2>Vagas e candidatura inteligente</h2><p class="hint">Clique em “Adaptar currículo” para ver uma versão direcionada à vaga e receber cursos gratuitos dos requisitos que faltam.</p>${list.map(j=>`<article class="job"><h3>${esc(j.name)}</h3><div class="meta">${esc(j.area)} · Requisitos: ${j.req.map(esc).join(', ')}</div><div class="actions"><button class="btn primary" onclick='apply(${JSON.stringify(j)})'>Adaptar currículo</button></div></article>`).join('')}</div>`}
function renderResume(){if(!state.nome){$('curriculo').innerHTML='<div class="panel"><h2>Seu currículo</h2><p class="hint">Salve seu perfil para gerar seu currículo.</p><button class="btn primary" onclick="tab(\'perfil\')">Ir para meu perfil</button></div>';return}const j={name:state.funcao||'Profissional',area:state.area||'Área profissional',req:[]};applyPreview(j)}
function applyPreview(j){const a=adapted(j);$('curriculo').innerHTML=`<div class="panel"><h2>Seu currículo</h2><p class="hint">Uma apresentação profissional baseada nos dados salvos.</p><div class="resume" id="resume"><div class="resume-head"><h2>${esc(state.nome)}</h2><p>${esc(state.email)}${state.telefone?' · '+esc(state.telefone):''}</p><strong>${esc(state.funcao||'Profissional')} · ${esc(state.area||'')}</strong></div><h3>Resumo profissional</h3><p>${esc(a.summary)}</p><h3>Formação</h3><p>${esc(state.formacao||'Não informada')}${state.instituicao?' — '+esc(state.instituicao):''}</p><h3>Experiências e competências</h3><p>${esc(state.experiencias||'Não informadas')}</p><h3>Idiomas</h3><p>${esc(state.idiomas||'Não informado')}</p></div><div class="actions"><button class="btn primary" onclick="downloadResume()">Baixar currículo em PDF</button><button class="btn" onclick="sendConfirmation()">Enviar confirmação por e-mail</button><button class="btn" onclick="tab('perfil')">Editar perfil</button></div></div>`}
function downloadResume(){const node=$('resume');if(!node){toast('Gere o currículo antes de baixar.',true);return}const w=window.open('','_blank');w.document.write(`<html><head><title>Currículo - ${esc(state.nome)}</title><style>body{font:14px Arial;color:#172333;padding:30px;max-width:800px;margin:auto}h2,h3{color:#153653;border-bottom:1px solid #ddd;padding-bottom:6px}.resume-head{border-bottom:3px solid #f5a623;margin-bottom:20px}</style></head><body>${node.outerHTML}<script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close();toast('Currículo pronto: escolha “Salvar como PDF” na janela de impressão.')}
function sendConfirmation(){const subject=encodeURIComponent('Confirmação de perfil — Farol.IA');const body=encodeURIComponent(`Olá, ${state.nome}!\n\nSeu perfil foi salvo com sucesso no Farol.IA.\n\nÁrea: ${state.area}\nFunção desejada: ${state.funcao}`);window.location.href=`mailto:${state.email}?subject=${subject}&body=${body}`;toast('Abrindo seu aplicativo de e-mail para confirmar o salvamento.')}
function render(name){if(name==='home')renderHome();if(name==='perfil')renderProfile();if(name==='vagas')renderJobs();if(name==='curriculo')renderResume()}
tab('home');
</script></body></html>
