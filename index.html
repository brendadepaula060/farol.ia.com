<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Farol.IA — mentor de carreira</title>
  <style>
    :root {
      --bg: #071522;
      --bg-2: #0f2336;
      --panel: #102840;
      --panel-2: #173a56;
      --line: #2d4b68;
      --gold: #f5a623;
      --gold-soft: #ffd98a;
      --text: #edf5ff;
      --muted: #a9bdd1;
      --ok: #73d3a0;
      --bad: #ff9c9c;
      --shadow: rgba(0, 0, 0, 0.22);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, #071522 0%, #102d46 100%);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(9, 27, 43, 0.9);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(6px);
    }

    .top {
      max-width: 1100px;
      margin: 0 auto;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      font-size: clamp(1.2rem, 2vw, 1.8rem);
      font-weight: 800;
      color: var(--gold-soft);
      line-height: 1.2;
    }

    .brand small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: none;
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .nav button,
    .btn {
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 10px 14px;
      background: rgba(255,255,255,0.03);
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .nav button.active,
    .btn.primary {
      background: linear-gradient(135deg, var(--gold), #d98d16);
      color: #162534;
      border-color: transparent;
    }

    .btn.secondary {
      background: rgba(255,255,255,0.03);
      color: var(--text);
    }

    .btn:hover,
    .nav button:hover {
      transform: translateY(-1px);
      filter: brightness(1.12);
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px 60px;
    }

    .screen {
      display: none;
      animation: fadeIn 0.2s ease;
    }

    .screen.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hero,
    .panel,
    .card,
    .job,
    .resume,
    .mini-box {
      background: rgba(16, 40, 64, 0.96);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--radius);
      box-shadow: 0 16px 30px var(--shadow);
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: clamp(22px, 5vw, 52px);
      background: radial-gradient(circle at top right, rgba(245,166,35,0.17), transparent 26%), rgba(16,40,64,0.96);
    }

    .tag {
      display: inline-flex;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--gold-soft);
      font-weight: 700;
      margin-bottom: 14px;
      font-size: 0.8rem;
    }

    .hero h1 {
      margin: 0 0 14px;
      font-size: clamp(2.1rem, 5vw, 4rem);
      line-height: 1.04;
      max-width: 720px;
    }

    .hero p {
      max-width: 700px;
      color: var(--muted);
      line-height: 1.6;
      margin: 0;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 18px;
    }

    .card {
      padding: 18px;
    }

    .card h3 {
      margin: 0 0 8px;
      color: var(--gold-soft);
    }

    .panel {
      padding: 18px;
      margin-top: 18px;
    }

    h2, h3, h4, p { margin-top: 0; }

    .hint,
    .tiny,
    .meta {
      color: var(--muted);
      line-height: 1.5;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }

    .field label {
      font-weight: 700;
      color: #cfe1f6;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #183650;
      color: var(--text);
      font: inherit;
    }

    .field textarea {
      min-height: 110px;
      resize: vertical;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      outline: 2px solid rgba(245,166,35,0.42);
      border-color: rgba(245,166,35,0.7);
    }

    .required {
      color: #ffcb77;
      font-weight: 700;
    }

    .notice {
      margin-top: 12px;
      padding: 14px;
      border-radius: 12px;
      background: rgba(115, 211, 160, 0.08);
      border: 1px solid rgba(115, 211, 160, 0.22);
      color: #e4fff0;
    }

    .notice.bad {
      background: rgba(255,156,156,0.08);
      border-color: rgba(255,156,156,0.26);
      color: #ffdada;
    }

    .job {
      margin-top: 12px;
      padding: 16px;
      background: rgba(255,255,255,0.02);
    }

    .job h3 {
      margin-bottom: 8px;
      color: var(--gold-soft);
    }

    .job .meta {
      display: block;
      margin-bottom: 12px;
    }

    .checklist {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .check-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.025);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 10px 12px;
    }

    .check-item input {
      accent-color: var(--gold);
    }

    .course-box {
      display: grid;
      gap: 12px;
      margin-top: 12px;
    }

    .course-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 12px 14px;
      border-radius: 10px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .resume {
      background: #f6f8fb;
      color: #18324a;
      padding: 28px 24px;
      margin-top: 18px;
      border: 1px solid rgba(0,0,0,0.05);
    }

    .resume .header {
      border-bottom: 3px solid var(--gold);
      padding-bottom: 14px;
      margin-bottom: 18px;
    }

    .resume .header h2,
    .resume h3,
    .resume h4 {
      color: #153653;
      margin-bottom: 8px;
    }

    .resume p {
      line-height: 1.6;
      color: #294867;
    }

    .pill {
      display: inline-block;
      margin: 4px 4px 0 0;
      padding: 5px 9px;
      border-radius: 999px;
      background: #f9df9d;
      color: #684309;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 20px;
      z-index: 50;
      max-width: 360px;
      padding: 14px 16px;
      border-radius: 12px;
      background: rgba(23,63,50,0.96);
      color: #dcfff0;
      border: 1px solid rgba(115, 211, 160, 0.5);
      box-shadow: 0 16px 35px rgba(0,0,0,0.3);
      display: none;
    }

    .toast.show {
      display: block;
      animation: fadeIn 0.2s ease;
    }

    footer {
      text-align: center;
      color: #7f92a7;
      padding: 22px 12px 48px;
      font-size: 0.8rem;
    }

    @media (max-width: 760px) {
      .top { flex-direction: column; align-items: flex-start; }
      .nav { width: 100%; justify-content: flex-start; }
      .nav button { flex: 1; }
      .grid { grid-template-columns: 1fr; }
      .course-item { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <header>
    <div class="top">
      <div class="brand">farol.ia<small>mentor digital de carreira</small></div>
      <nav class="nav">
        <button data-tab="home" class="active">Início</button>
        <button data-tab="perfil">Perfil</button>
        <button data-tab="vagas">Vagas</button>
        <button data-tab="curriculo">Currículo</button>
      </nav>
    </div>
  </header>

  <main>
    <section id="home" class="screen active"></section>
    <section id="perfil" class="screen"></section>
    <section id="vagas" class="screen"></section>
    <section id="curriculo" class="screen"></section>
  </main>

  <div id="toast" class="toast"></div>

  <footer>Farol.IA — seus dados ficam salvos neste dispositivo.</footer>

  <script>
    'use strict';

    const areas = [
      'Administração e Finanças', 'Agricultura e Meio Ambiente', 'Artes e Design', 'Atendimento e Serviços',
      'Beleza e Estética', 'Comunicação e Marketing', 'Construção Civil', 'Educação e Formação',
      'Gastronomia e Hotelaria', 'Informática e Tecnologia', 'Saúde e Bem-Estar', 'Vendas e Comercial'
    ];

    const jobs = [
      { name: 'Assistente Administrativo', area: 'Administração e Finanças', req: ['Excel Básico', 'Administração'] },
      { name: 'Assistente de Marketing', area: 'Comunicação e Marketing', req: ['Marketing Digital', 'Redes Sociais'] },
      { name: 'Suporte Técnico', area: 'Informática e Tecnologia', req: ['Excel Básico', 'Fundamentos de TI'] },
      { name: 'Atendente de Serviços', area: 'Atendimento e Serviços', req: ['Atendimento ao Cliente', 'Liderança de Equipe'] },
      { name: 'Consultor de Vendas', area: 'Vendas e Comercial', req: ['Vendas Consultivas', 'Negociação'] },
      { name: 'Técnico de Enfermagem', area: 'Saúde e Bem-Estar', req: ['Primeiros Socorros', 'Atendimento em Saúde'] }
    ];

    const freeCourses = {
      'Administração e Finanças': [
        ['Excel Básico', 'Fundação Bradesco', 'https://www.ev.org.br/cursos'],
        ['Administração', 'Sebrae', 'https://www.sebrae.com.br/sites/PortalSebrae/curso']
      ],
      'Comunicação e Marketing': [
        ['Marketing Digital', 'Sebrae', 'https://www.sebrae.com.br/sites/PortalSebrae/curso'],
        ['Redes Sociais', 'Fundação Bradesco', 'https://www.ev.org.br/cursos']
      ],
      'Informática e Tecnologia': [
        ['Excel Básico', 'Fundação Bradesco', 'https://www.ev.org.br/cursos'],
        ['Fundamentos de TI', 'Sebrae', 'https://www.sebrae.com.br/sites/PortalSebrae/curso']
      ],
      'Atendimento e Serviços': [
        ['Atendimento ao Cliente', 'Fundação Bradesco', 'https://www.ev.org.br/cursos'],
        ['Liderança de Equipe', 'Sebrae', 'https://www.sebrae.com.br/sites/PortalSebrae/curso']
      ],
      'Vendas e Comercial': [
        ['Vendas Consultivas', 'Sebrae', 'https://www.sebrae.com.br/sites/PortalSebrae/curso'],
        ['Negociação', 'Fundação Bradesco', 'https://www.ev.org.br/cursos']
      ],
      'Saúde e Bem-Estar': [
        ['Primeiros Socorros', 'Fundação Bradesco', 'https://www.ev.org.br/cursos'],
        ['Atendimento em Saúde', 'Sebrae', 'https://www.sebrae.com.br/sites/PortalSebrae/curso']
      ]
    };

    const blank = {
      nome: '',
      email: '',
      telefone: '',
      dataNascimento: '',
      formacao: '',
      instituicao: '',
      funcao: '',
      area: '',
      experiencias: '',
      idiomas: '',
      cursos: '',
      cursosSalvos: [],
      candidaturas: []
    };

    let selectedJob = null;
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    function loadState() {
      try {
        const raw = localStorage.getItem('farolIA_profile');
        if (!raw) return structuredClone(blank);
        const parsed = JSON.parse(raw);
        return {
          ...structuredClone(blank),
          ...parsed,
          cursosSalvos: Array.isArray(parsed.cursosSalvos) ? parsed.cursosSalvos : [],
          candidaturas: Array.isArray(parsed.candidaturas) ? parsed.candidaturas : []
        };
      } catch (error) {
        return structuredClone(blank);
      }
    }

    let state = loadState();

    function save() {
      localStorage.setItem('farolIA_profile', JSON.stringify(state));
    }

    function toast(text, bad = false) {
      const node = $('toast');
      if (!node) return;
      node.textContent = text;
      node.style.background = bad ? 'rgba(83,45,50,0.96)' : 'rgba(23,63,50,0.96)';
      node.style.borderColor = bad ? 'rgba(255,156,156,0.5)' : 'rgba(115,211,160,0.5)';
      node.classList.add('show');
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => node.classList.remove('show'), 4200);
    }

    function tab(name) {
      document.querySelectorAll('.screen').forEach((element) => element.classList.remove('active'));
      const screen = $(name);
      if (screen) screen.classList.add('active');
      document.querySelectorAll('[data-tab]').forEach((button) => {
        button.classList.toggle('active', button.dataset.tab === name);
      });

      if (name === 'home') renderHome();
      if (name === 'perfil') renderProfile();
      if (name === 'vagas') renderJobs();
      if (name === 'curriculo') renderResume();
    }

    document.querySelectorAll('[data-tab]').forEach((button) => {
      button.onclick = () => tab(button.dataset.tab);
    });

    function renderHome() {
      $('home').innerHTML = `
        <div class="hero">
          <span class="tag">🧭 mentor de carreira com IA</span>
          <h1>Seu caminho profissional começa aqui.</h1>
          <p>Organize seu perfil, gere um currículo bonito, veja como cada vaga pode ser adaptada ao seu histórico e acompanhe os cursos gratuitos que faltam para subir de nível.</p>
          <div class="actions">
            <button class="btn primary" type="button" onclick="tab('perfil')">Completar meu perfil</button>
            <button class="btn secondary" type="button" onclick="tab('vagas')">Ver vagas</button>
          </div>
        </div>

        <div class="cards">
          <div class="card">
            <h3>Perfil completo</h3>
            <p class="hint">Validação de campos obrigatórios e confirmação clara ao salvar.</p>
          </div>
          <div class="card">
            <h3>Currículo profissional</h3>
            <p class="hint">Visual mais elegante, curva de apresentação e download em PDF.</p>
          </div>
          <div class="card">
            <h3>Candidatura inteligente</h3>
            <p class="hint">Mostra como a vaga combina com seu perfil e indica cursos gratuitos para os requisitos que faltarem.</p>
          </div>
        </div>
      `;
    }

    function getAreaCourses(area) {
      const arr = freeCourses[area] || [];
      return arr.length ? arr : [[ 'Curso de atualização', 'Gratuito', 'https://www.ev.org.br/cursos' ]];
    }

    function renderCourseChecklist() {
      const area = $('f_area')?.value || state.area;
      const areaCourses = getAreaCourses(area);
      const selected = new Set(state.cursosSalvos || []);

      $('courseChecklist').innerHTML = areaCourses.map(([name]) => `
        <label class="check-item">
          <input type="checkbox" value="${esc(name)}" ${selected.has(name) ? 'checked' : ''}>
          <span>${esc(name)}</span>
        </label>
      `).join('');
    }

    function renderProfile() {
      const defs = [
        ['nome', 'Nome completo', 'text'],
        ['email', 'E-mail', 'email'],
        ['telefone', 'Telefone', 'tel'],
        ['dataNascimento', 'Data de nascimento', 'date'],
        ['formacao', 'Formação', 'text'],
        ['instituicao', 'Instituição', 'text'],
        ['funcao', 'Função desejada', 'text'],
        ['area', 'Área de interesse', 'select'],
        ['experiencias', 'Experiências e competências', 'textarea'],
        ['idiomas', 'Idiomas', 'text'],
        ['cursos', 'Cursos que você já fez', 'text']
      ];

      const fields = defs.map(([key, label, type]) => {
        const required = ['nome', 'email', 'funcao', 'area'].includes(key) ? ' required' : '';
        const star = required ? ' <span class="required">*</span>' : '';
        const value = String(state[key] ?? '');

        if (type === 'select') {
          return `
            <div class="field">
              <label for="f_${key}">${label}${star}</label>
              <select id="f_${key}"${required}>
                <option value="">Selecione</option>
                ${areas.map((area) => `<option value="${esc(area)}" ${area === value ? 'selected' : ''}>${esc(area)}</option>`).join('')}
              </select>
            </div>
          `;
        }

        if (type === 'textarea') {
          return `
            <div class="field" style="grid-column: 1 / -1;">
              <label for="f_${key}">${label}${star}</label>
              <textarea id="f_${key}"${required}>${esc(value)}</textarea>
            </div>
          `;
        }

        return `
          <div class="field">
            <label for="f_${key}">${label}${star}</label>
            <input id="f_${key}" type="${type}" value="${esc(value)}"${required}>
          </div>
        `;
      }).join('');

      $('perfil').innerHTML = `
        <div class="panel">
          <h2>Meu perfil</h2>
          <p class="hint">Os campos com <span class="required">*</span> são obrigatórios.</p>
          <form id="profileForm">
            <div class="grid">${fields}</div>
            <div class="panel" style="margin-top:16px;">
              <h3>Meus cursos gratuitos</h3>
              <p class="hint">Selecione os cursos que você já concluiu para comparar com as vagas e reforçar seus requisitos.</p>
              <div id="courseChecklist" class="checklist"></div>
            </div>
            <div class="actions">
              <button class="btn primary" type="submit">Salvar perfil</button>
              <button class="btn secondary" type="button" onclick="tab('curriculo')">Ver currículo</button>
            </div>
          </form>
        </div>
      `;

      renderCourseChecklist();

      const areaField = $('f_area');
      if (areaField) {
        areaField.onchange = () => renderCourseChecklist();
      }

      $('profileForm').onsubmit = (event) => {
        event.preventDefault();
        if (!event.target.reportValidity()) return;

        defs.forEach(([key]) => {
          const node = $('f_' + key);
          if (!node) return;
          state[key] = node.value.trim();
        });

        const checklist = $('courseChecklist');
        state.cursosSalvos = [];
        if (checklist) {
          checklist.querySelectorAll('input:checked').forEach((box) => {
            state.cursosSalvos.push(box.value);
          });
        }

        save();
        toast('Perfil salvo com sucesso!');
        renderProfile();
      };
    }

    function buildMatchSummary(job) {
      const profileText = `${state.experiencias || ''} ${state.cursos || ''} ${state.funcao || ''}`.toLowerCase();
      const missing = job.req.filter((item) => {
        const lower = item.toLowerCase();
        return !profileText.includes(lower) && !(state.cursosSalvos || []).some((course) => course.toLowerCase().includes(lower));
      });

      return {
        missing,
        summary: `Profissional com foco em ${state.funcao || 'carreira'} e interesse em ${job.area}. Experiência em ${state.experiencias || 'aprimoramento contínuo e aprendizado prático.'}`
      };
    }

    function saveApplication(job) {
      const already = state.candidaturas.some((item) => item.name === job.name && item.area === job.area);
      if (!already) {
        state.candidaturas.push({
          name: job.name,
          area: job.area,
          date: new Date().toISOString(),
          summary: `Candidatura para ${job.name} na área de ${job.area}.`
        });
        save();
      }
      toast('Candidatura salva com sucesso!');
    }

    function renderJobs() {
      if (!state.nome || !state.email || !state.funcao || !state.area) {
        $('vagas').innerHTML = `
          <div class="panel">
            <h2>Vagas recomendadas</h2>
            <p class="hint">Complete o cadastro obrigatório para receber vagas e adaptar seu currículo corretamente.</p>
            <div class="actions">
              <button class="btn primary" type="button" onclick="tab('perfil')">Ir para o perfil</button>
            </div>
          </div>
        `;
        return;
      }

      const filtered = jobs.filter((job) => {
        if (!state.area) return true;
        return job.area === state.area;
      });

      $('vagas').innerHTML = `
        <div class="panel">
          <h2>Vagas recomendadas</h2>
          <p class="hint">Adapte seu currículo para a vaga e veja quais cursos gratuitos ajudam a preencher os requisitos que faltarem.</p>
          ${filtered.map((job) => {
            const match = buildMatchSummary(job);
            return `
              <article class="job">
                <h3>${esc(job.name)}</h3>
                <span class="meta">${esc(job.area)} · Requisitos: ${job.req.map((item) => esc(item)).join(', ')}</span>
                <p class="hint">${esc(match.missing.length ? `Faltam: ${match.missing.join(', ')}.` : 'Seu perfil já está alinhado com essa oportunidade.')}</p>
                <div class="actions">
                  <button class="btn primary" type="button" onclick="openJobApplication(${JSON.stringify(job).replace(/"/g, '&quot;')})">Adaptar currículo</button>
                  <button class="btn secondary" type="button" onclick="saveApplication(${JSON.stringify(job).replace(/"/g, '&quot;')})">Salvar candidatura</button>
                </div>
              </article>
            `;
          }).join('')}
        </div>
      `;
    }

    function openJobApplication(job) {
      selectedJob = job;
      tab('curriculo');
      renderResume();
    }

    function renderResume() {
      const job = selectedJob;
      const base = {
        nome: state.nome || 'Seu nome',
        email: state.email || 'seuemail@email.com',
        telefone: state.telefone || '',
        funcao: state.funcao || 'Profissional',
        area: state.area || 'Área de interesse',
        formacao: state.formacao || 'Formação não informada',
        instituicao: state.instituicao || '',
        experiencias: state.experiencias || 'Descreva suas experiências mais relevantes aqui.',
        idiomas: state.idiomas || 'Não informado',
        cursos: state.cursos || 'Cursos e especializações não informados.'
      };

      const profileSummary = `Profissional com foco em ${base.funcao} e interesse em ${base.area}. ${base.experiencias}`;
      const match = job ? buildMatchSummary(job) : { missing: [], summary: profileSummary };

      let courseHtml = '';
      if (job) {
        const missing = match.missing;
        if (missing.length) {
          courseHtml = `
            <div class="notice bad">
              <strong>Faltam alguns requisitos:</strong>
              <div class="course-box">
                ${getAreaCourses(job.area).filter(([name]) => missing.some((req) => req.toLowerCase() === name.toLowerCase() || name.toLowerCase().includes(req.toLowerCase())) || missing.length).map(([name, provider, link]) => `
                  <div class="course-item">
                    <div>
                      <strong>${esc(name)}</strong><br>
                      <span class="tiny">${esc(provider)}</span>
                    </div>
                    <a class="btn secondary" href="${esc(link)}" target="_blank" rel="noreferrer">Abrir</a>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        } else {
          courseHtml = '<div class="notice">Você já atende aos principais requisitos desta vaga.</div>';
        }
      }

      const resumeHtml = `
        <div class="panel">
          <h2>${job ? `Currículo adaptado: ${esc(job.name)}` : 'Meu currículo'}</h2>
          <p class="hint">Versão profissional e pronta para impressão ou envio por e-mail.</p>

          ${job ? courseHtml : ''}

          <div class="resume" id="resume-box">
            <div class="header">
              <h2>${esc(base.nome)}</h2>
              <p>${esc(base.email)}${base.telefone ? ' · ' + esc(base.telefone) : ''}</p>
              <strong>${esc(base.funcao)} · ${esc(base.area)}</strong>
            </div>

            <h3>Resumo profissional</h3>
            <p>${esc(match.summary || profileSummary)}</p>

            <h3>Formação</h3>
            <p>${esc(base.formacao)}${base.instituicao ? ' · ' + esc(base.instituicao) : ''}</p>

            <h3>Experiências e competências</h3>
            <p>${esc(base.experiencias)}</p>

            <h3>Idiomas</h3>
            <p>${esc(base.idiomas)}</p>

            <h3>Cursos</h3>
            <div>
              ${String(base.cursos || '').split(',').map((item) => item.trim()).filter(Boolean).map((item) => `<span class="pill">${esc(item)}</span>`).join('') || '<p>Não informado</p>'}
            </div>
          </div>

          <div class="actions">
            <button class="btn primary" type="button" onclick="downloadResume()">Baixar currículo em PDF</button>
            <button class="btn secondary" type="button" onclick="sendConfirmation()">Enviar confirmação por e-mail</button>
            <button class="btn secondary" type="button" onclick="tab('perfil')">Editar perfil</button>
          </div>
        </div>
      `;

      $('curriculo').innerHTML = resumeHtml;
    }

    function downloadResume() {
      const node = $('resume-box');
      if (!node) {
        toast('Primeiro gere o currículo antes de baixar.', true);
        return;
      }

      const win = window.open('', '_blank');
      win.document.write(`
        <html>
          <head>
            <title>Currículo - ${esc(state.nome || 'Farol.IA')}</title>
            <style>
              body { font-family: Arial, sans-serif; color: #18324a; padding: 36px; max-width: 850px; margin: 0 auto; }
              h2, h3 { color: #153653; }
              .header { border-bottom: 3px solid #f5a623; padding-bottom: 12px; margin-bottom: 18px; }
              .pill { display: inline-block; background: #f9df9d; color: #684309; border-radius: 999px; padding: 5px 9px; margin: 4px 6px 0 0; font-size: 12px; font-weight: 700; }
              p { line-height: 1.6; }
            </style>
          </head>
          <body>
            ${node.innerHTML}
            <script>
              window.onload = () => window.print();
            <\/script>
          </body>
        </html>
      `);
      win.document.close();
      toast('Currículo pronto para impressão. Escolha “Salvar como PDF”.');
    }

    function sendConfirmation() {
      const email = state.email || '';
      const subject = encodeURIComponent('Confirmação de perfil — Farol.IA');
      const body = encodeURIComponent(`Olá, ${state.nome || 'Candidato(a)'}!\n\nSeu perfil foi salvo com sucesso no Farol.IA.\n\nÁrea: ${state.area || 'Não informada'}\nFunção desejada: ${state.funcao || 'Não informada'}\n\nAtenciosamente,\nFarol.IA`);

      if (!email) {
        toast('Cadastre um e-mail válido antes de enviar a confirmação.', true);
        return;
      }

      window.location.href = `mailto:${email}?subject=${subject}&body=${body}`;
      toast('Abrindo seu e-mail para confirmar o perfil.');
    }

    function render(name) {
      if (name === 'home') renderHome();
      if (name === 'perfil') renderProfile();
      if (name === 'vagas') renderJobs();
      if (name === 'curriculo') renderResume();
    }

    render('home');
  </script>
</body>
</html>
